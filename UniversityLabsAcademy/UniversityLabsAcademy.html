E(x)']}}\nconst e=[rnd(1,8),rnd(11,98)][rnd(0,1)],den=10**String(e).length-1;return{q:`اكتب 0.(${e}) على شكل كسر مختزل`,a:[e/den],i:['p/q']}},\nl=>{const a=rnd(-5,5),b=rnd(-5,5),c=rnd(-5,5),d=rnd(-5,5),z=`(${cs(a,b)})`,w=`(${cs(c,d)})`;\nreturn l==1?{q:`${z} + ${w}`,a:[a+c,b+d],i:['Re','Im']}:l==2?{q:`${z} · ${w}`,a:[a*c-b*d,a*d+b*c],i:['Re','Im']}:{q:`${z}²`,a:[a*a-b*b,2*a*b],i:['Re','Im']}},\nl=>{const u=rnd(-5,9),r=rnd(2,5),n=rnd(3,8),g=Math.abs(u)+1,m=Math.min(n,5);\nreturn l==1?{q:`متتالية حسابية u₀=${u} وأساسها ${r}. احسب u${n}`,a:[u+n*r],i:['u']}:l==2?{q:`متتالية هندسية u₀=${g} وأساسها ${r}. احسب u${m}`,a:[g*r**m],i:['u']}:{q:`حسابية u₀=${u} وأساسها ${r}. احسب u₀+u₁+…+u${n}`,a:[(n+1)*(2*u+n*r)/2],i:['S']}},\nl=>{const a=rnd(1,5),b=rnd(-4,6),c=rnd(-4,6),d=rnd(1,5),e=rnd(-3,5);\nreturn l==1?{q:`lim x→${a} ( x² ${sg(b)}x ${sg(c)} )`,a:[a*a+b*a+c],i:['ℓ']}:l==2?{q:`lim x→+∞ (${a}x² ${sg(b)}) / (${d}x² ${sg(e)})`,a:[a/d],i:['ℓ (كسر أو عشري)']}:{q:`lim x→${a} (x² − ${a*a}) / (x − ${a})`,a:[2*a],i:['ℓ']}}];\nlet dl=[1,1,1,1],dk=[0,0,0,0],dq,dmsg='';\nfunction drill(){const l=dl[sm];dq=G[sm](l);\n$('#main').innerHTML=`\u003cdiv class=card>\u003ch2>🎲 تدريب متدرّج — ${M[sm].n}\u003c/h2>\u003cdiv class=tag>المستوى ${l}/3 · سلسلة صحيحة: ${dk[sm]} (كل 3 متتالية ترفع المستوى)\u003c/div>${dmsg}\u003cp style=\"direction:ltr;text-align:right\">\u003cb>${dq.q}\u003c/b>\u003c/p>\u003cdiv class=lab>${dq.i.map((x,j)=>`${x} \u003cinput type=text id=da${j} style=\"width:42%\">`).join(' ')}\u003c/div>\u003cdiv class=btns>\u003cspan>\u003c/span>\u003cbutton class=p onclick=dchk()>تحقّق\u003c/button>\u003c/div>\u003c/div>`}\nfunction dchk(){const pq=dq.q,ok=dq.a.every((x,j)=>{const r=pv($('#da'+j).value);return Math.abs(r.v-x)\u003c1e-6&&(r.red||dq.i[j]!='p/q')});\nif(ok){dk[sm]++;S.x+=2;save();if(dk[sm]%3==0&&dl[sm]\u003c3)dl[sm]++}else dk[sm]=0;\ndmsg=ok?'\u003cdiv class=ex>✅ صحيح!\u003c/div>':`\u003cdiv class=ex>❌ جواب «${pq}» هو: ${dq.a.map(fm).join(' ، ')}\u003c/div>`;top_();drill()}\n\ndraw();\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"name": "الجبر", "note": "المجموعات والبنى الجبرية والجبر الخطي", "html": "\u003c!doctype html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>مختبر الجبر التفاعلي\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f7fb;--card:#fff;--ink:#182235;--muted:#64748b;--accent:#3457d5;--line:#dce4f0;--soft:#edf2ff;--good:#e8f8ef;--bad:#fff0ef}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}\nheader{background:linear-gradient(130deg,#14264d,#3457d5);color:white;padding:28px 18px}\n.wrap{max-width:1050px;margin:auto;padding:0 14px}h1{margin:0 0 5px;font-size:28px}header p{margin:0;color:#e3eaff}\nnav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}\nbutton{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:9px 14px}\nbutton:hover{border-color:var(--accent)}button.active,.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n.layout{display:grid;grid-template-columns:255px 1fr;gap:16px;align-items:start}\naside,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}\naside{position:sticky;top:10px}aside h3{margin:0 0 10px}\n.lesson-list{display:grid;gap:7px}.lesson-list button{text-align:right;background:#f8faff}\n.lesson-list button.active{background:var(--soft);border-color:#aabaff;color:#203b9d;font-weight:bold}\n.panel{min-height:450px}.muted{color:var(--muted)}.tag{display:inline-block;background:var(--soft);color:#2945a5;border-radius:20px;padding:2px 10px;font-size:13px}\nh2{margin:0 0 10px;font-size:23px}h3{font-size:18px;margin:18px 0 6px}\n.card{border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0;background:#fff}\n.formula{direction:ltr;text-align:center;font-family:Georgia,serif;font-size:19px;background:#f7f9ff;padding:12px;border-radius:10px;overflow:auto}\nul{padding-right:22px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}\n.question{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}\n.option{display:block;margin:7px 0;text-align:right;width:100%}.feedback{padding:10px;border-radius:10px;margin-top:10px}.good{background:var(--good)}.bad{background:var(--bad)}\n.progress{height:9px;background:#e7ebf3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#3457d5;width:0}\nfooter{text-align:center;color:var(--muted);padding:25px 10px;font-size:13px}\ninput{font:inherit;padding:8px;border:1px solid var(--line);border-radius:9px;max-width:100%}\n@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static}.lesson-list{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:23px}}\n:root[data-theme=\"dark\"]{--bg:#0f1a2a;--card:#17243a;--ink:#e6ecf7;--muted:#9db0cc;--accent:#7c9bff;--line:#2b3c5a;--soft:#1e2d4d;--good:#12351f;--bad:#3b1a1a;color-scheme:dark}:root[data-theme=\"dark\"] .card{background:var(--card)}:root[data-theme=\"dark\"] button:not(.active):not(.primary){background:var(--card);color:var(--ink)}:root[data-theme=\"dark\"] .lesson-list button:not(.active){background:var(--bg)}:root[data-theme=\"dark\"] .formula{background:var(--soft);color:var(--ink)}:root[data-theme=\"dark\"] .progress{background:var(--line)}:root[data-theme=\"dark\"] .tag{color:#b9c9ff}:root[data-theme=\"dark\"] button.active,:root[data-theme=\"dark\"] .primary{color:#0b1226}:root[data-theme=\"dark\"] .lesson-list button.active{color:#b9c9ff;border-color:#4a63b5;background:var(--soft)}:root[data-theme=\"dark\"] input,:root[data-theme=\"dark\"] select{background:var(--card);color:var(--ink)}:root[data-theme=\"dark\"] table.t th{background:var(--soft)}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\n\u003ch1>مختبر الجبر التفاعلي\u003c/h1>\n\u003cp>A first course in algebra — Yassine Guerboussa | شرح عربي، أمثلة، تمارين واختبارات\u003c/p>\n\u003c/div>\u003c/header>\n\u003cmain class=\"wrap\">\n\u003cnav id=\"chapters\">\n\u003cbutton class=\"active\" data-ch=\"0\">الفصل 1: المجموعات والعلاقات\u003c/button>\n\u003cbutton data-ch=\"1\">الفصل 2: البنى الجبرية\u003c/button>\n\u003cbutton data-ch=\"2\">الفصل 3: الجبر الخطي\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"card\">\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap\">\u003cstrong>تقدمك في المختبر\u003c/strong>\u003cspan id=\"progressText\" class=\"muted\">0 من 12 درسًا\u003c/span>\u003c/div>\n\u003cdiv class=\"progress\">\u003cspan id=\"progressBar\">\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"layout\">\n\u003caside>\u003ch3 id=\"sideTitle\">الفصل الأول\u003c/h3>\u003cdiv class=\"lesson-list\" id=\"lessonList\">\u003c/div>\n\u003cp class=\"muted\" style=\"font-size:12px\">يُحفظ تقدم الدروس على هذا المتصفح.\u003c/p>\u003c/aside>\n\u003csection class=\"panel\" id=\"content\" aria-live=\"polite\">\u003c/section>\n\u003c/div>\n\u003c/main>\n\u003cfooter>المختبر مبني على ملف Cour.pdf المرفق. بعض العناوين التي وردت في الملف دون شرح موسع عُرضت كعناوين تمهيدية فقط.\u003c/footer>\n\u003cscript>\nconst chapters = [\n{title:\"المجموعات والعلاقات\", lessons:[\n{title:\"1. المجموعات والعناصر\",body:`\u003cp>المجموعة هي تجمّع محدد من العناصر. نكتب \u003cb>a ∈ A\u003c/b> إذا كان العنصر a ينتمي إلى A، و\u003cb>a ∉ A\u003c/b> إذا لم ينتمِ إليها.\u003c/p>\u003cdiv class=\"formula\">A = {1, 2, 3} &nbsp; ; &nbsp; 2 ∈ A\u003c/div>\u003cp>تكون مجموعتان متساويتين إذا كان لهما العناصر نفسها، بصرف النظر عن ترتيب كتابة العناصر.\u003c/p>\u003ch3>الاحتواء\u003c/h3>\u003cp>نقول إن A مجموعة جزئية من X ونكتب A ⊆ X إذا كان كل عنصر من A عنصرًا في X.\u003c/p>\u003cdiv class=\"formula\">A = B ⇔ (A ⊆ B و B ⊆ A)\u003c/div>\u003cp>المجموعة الخالية ∅ لا تحتوي أي عنصر، وهي مجموعة جزئية من كل مجموعة. أما مجموعة الأجزاء P(X) فهي مجموعة جميع المجموعات الجزئية لـ X.\u003c/p>`,example:\"إذا كانت X={1,2} فإن P(X)={∅,{1},{2},{1,2}}، وعدد عناصرها 2²=4.\",quiz:{q:\"إذا كانت A={a,b}، فما عدد عناصر P(A)؟\",opts:[\"2\",\"3\",\"4\",\"8\"],a:2,why:\"عدد أجزاء مجموعة من n عناصر هو 2ⁿ؛ هنا 2²=4.\"}},\n{title:\"2. العمليات على المجموعات\",body:`\u003cp>لتكن A وB مجموعتين:\u003c/p>\u003cul>\u003cli>\u003cb>التقاطع A∩B:\u003c/b> العناصر المشتركة بينهما.\u003c/li>\u003cli>\u003cb>الاتحاد A∪B:\u003c/b> العناصر التي تنتمي إلى واحدة منهما على الأقل.\u003c/li>\u003cli>\u003cb>الفرق A−B:\u003c/b> عناصر A التي لا تنتمي إلى B.\u003c/li>\u003cli>\u003cb>الفرق المتماثل AΔB:\u003c/b> العناصر التي تنتمي إلى واحدة فقط.\u003c/li>\u003cli>\u003cb>المتممة Aᶜ:\u003c/b> عناصر المجموعة الكلية X التي لا تنتمي إلى A.\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">A Δ B = (A−B) ∪ (B−A)\u003c/div>\u003ch3>قوانين دي مورغان\u003c/h3>\u003cdiv class=\"formula\">(A∩B)ᶜ = Aᶜ∪Bᶜ\u003cbr>(A∪B)ᶜ = Aᶜ∩Bᶜ\u003c/div>`,example:\"إذا A={1,2,3} وB={3,4}، فإن A∩B={3} وA∪B={1,2,3,4} وA−B={1,2}.\",quiz:{q:\"إذا A={1,2,3} وB={3,4}، فما A−B؟\",opts:[\"{3}\",\"{1,2}\",\"{1,2,3,4}\",\"{4}\"],a:1,why:\"نحتفظ بعناصر A التي لا توجد في B، وهي 1 و2.\"}},\n{title:\"3. الجداء الديكارتي\",body:`\u003cp>الجداء الديكارتي A×B هو مجموعة الأزواج المرتبة (a,b) حيث a∈A وb∈B. الترتيب مهم عمومًا، لذلك A×B لا يساوي بالضرورة B×A.\u003c/p>\u003cdiv class=\"formula\">A×B = {(a,b) | a∈A, b∈B}\u003c/div>\u003cp>يتساوى زوجان مرتبان إذا تساوى العنصر الأول مع الأول والثاني مع الثاني.\u003c/p>`,example:\"إذا A={0,1} وB={x,y} فإن A×B={(0,x),(0,y),(1,x),(1,y)}.\",quiz:{q:\"كم عنصرًا في A×B إذا كان |A|=3 و|B|=4؟\",opts:[\"7\",\"12\",\"16\",\"64\"],a:1,why:\"عدد عناصر الجداء يساوي حاصل ضرب العددين: 3×4=12.\"}},\n{title:\"4. التطبيقات أو الدوال\",body:`\u003cp>التطبيق f:X→Y يربط كل عنصر x من X بعنصر وحيد f(x) من Y. تسمى X مجموعة الانطلاق وY مجموعة الوصول.\u003c/p>\u003cul>\u003cli>\u003cb>حقني Injective:\u003c/b> إذا f(x)=f(x′) فإن x=x′.\u003c/li>\u003cli>\u003cb>شامل Surjective:\u003c/b> كل y∈Y له سابق x∈X بحيث f(x)=y.\u003c/li>\u003cli>\u003cb>تقابلي Bijective:\u003c/b> حقني وشامل معًا.\u003c/li>\u003c/ul>\u003cp>الصورة المباشرة لمجموعة A⊆X هي f(A)، والصورة العكسية لمجموعة B⊆Y هي f⁻¹(B)={x∈X | f(x)∈B}. الصورة العكسية لا تتطلب أن تكون f تقابلية.\u003c/p>`,example:\"للدالة f(x)=x² من R إلى R: لدينا f(−2)=f(2)=4، لذلك ليست حقنية. كما أنها لا تأخذ قيمًا سالبة، لذلك ليست شاملة على R.\",quiz:{q:\"الدالة f:R→R المعرفة بـ f(x)=x² هل هي حقنية؟\",opts:[\"نعم\",\"لا\"],a:1,why:\"لأن f(2)=f(−2)=4 مع أن 2≠−2.\"}},\n{title:\"5. عائلات المجموعات\",body:`\u003cp>عائلة مجموعات مفهرسة {Aᵢ}ᵢ∈I هي تعيين يربط بكل فهرس i مجموعة Aᵢ. يمكن تعميم الاتحاد والتقاطع على عائلة كاملة:\u003c/p>\u003cdiv class=\"formula\">⋂ᵢ∈I Aᵢ = {x | x∈Aᵢ لكل i}\u003cbr>⋃ᵢ∈I Aᵢ = {x | يوجد i بحيث x∈Aᵢ}\u003c/div>\u003cp>وتعمم قوانين دي مورغان على العائلات:\u003c/p>\u003cdiv class=\"formula\">(⋃ Aᵢ)ᶜ = ⋂ Aᵢᶜ\u003cbr>(⋂ Aᵢ)ᶜ = ⋃ Aᵢᶜ\u003c/div>`,example:\"إذا Aₙ=]−1/n,1/n[ لكل n≥1، فإن تقاطع جميع Aₙ هو {0}.\",quiz:{q:\"الاتحاد ⋃Aᵢ يحتوي على:\",opts:[\"العناصر الموجودة في كل المجموعات\",\"العناصر الموجودة في مجموعة واحدة على الأقل\",\"العناصر غير الموجودة في أي مجموعة\"],a:1,why:\"الاتحاد يجمع كل عنصر ينتمي إلى مجموعة واحدة على الأقل.\"}},\n{title:\"6. العلاقات الثنائية والترتيب\",body:`\u003cp>العلاقة من X إلى Y هي مجموعة جزئية من X×Y. والعلاقة على X هي علاقة من X إلى نفسها.\u003c/p>\u003ch3>علاقة التكافؤ\u003c/h3>\u003cp>تكون العلاقة انعكاسية، متناظرة، ومتعدية. مثال الملف: التطابق بترديد n على الأعداد الصحيحة.\u003c/p>\u003ch3>علاقة الترتيب الجزئي\u003c/h3>\u003cp>تكون انعكاسية، مضادة للتناظر، ومتعدية. من أمثلتها الترتيب المعتاد على N وعلاقة الاحتواء على P(X).\u003c/p>\u003cp>\u003cb>ترتيب الجداء:\u003c/b> نقارن كل مركبة على حدة. \u003cb>الترتيب المعجمي:\u003c/b> نقارن أول مركبة مختلفة، كما في ترتيب الكلمات في القاموس.\u003c/p>`,example:\"على N²، (1,2)≤(2,1) غير صحيحة في ترتيب الجداء لأن 2≤1 غير صحيحة. أما الترتيب المعجمي فيقارن المركبة الأولى أولًا.\",quiz:{q:\"أي خاصية تميز علاقة التكافؤ؟\",opts:[\"الانعكاسية والتناظر والتعدي\",\"الانعكاسية ومضادة التناظر والتعدي\",\"التناظر فقط\"],a:0,why:\"علاقة التكافؤ تجمع ثلاث خصائص: الانعكاسية والتناظر والتعدي.\"}}\n]},\n{title:\"البنى الجبرية\",lessons:[\n{title:\"1. العمليات الثنائية\",body:`\u003cp>العملية الثنائية على مجموعة X هي تطبيق μ:X×X→X؛ أي إن كل زوج مرتب من عناصر X ينتج عنصرًا من X. تسمى أحيانًا قانون تركيب.\u003c/p>\u003cdiv class=\"formula\">μ(x,y) = x * y ∈ X\u003c/div>\u003cp>من أمثلتها الجمع والضرب على N، واتحاد وتقاطع المجموعات على P(E).\u003c/p>\u003ch3>التجميعية\u003c/h3>\u003cp>تكون العملية تجميعية إذا (x*y)*z = x*(y*z) لكل x,y,z. المجموعة المزودة بعملية تجميعية تسمى نصف زمرة.\u003c/p>`,example:\"الطرح على R ليس تجميعيًا: (8−4)−2=2، بينما 8−(4−2)=6.\",quiz:{q:\"هل الطرح على R عملية تجميعية؟\",opts:[\"نعم\",\"لا\"],a:1,why:\"القيمتان (8−4)−2 و8−(4−2) مختلفتان.\"}},\n{title:\"2. الزمر والزمر الجزئية\",body:`\u003cp>الزمرة مجموعة G مزودة بعملية تحقق:\u003c/p>\u003col>\u003cli>التجميعية: (xy)z=x(yz).\u003c/li>\u003cli>وجود عنصر محايد e: xe=ex=x.\u003c/li>\u003cli>وجود معكوس لكل عنصر x: xx⁻¹=x⁻¹x=e.\u003c/li>\u003c/ol>\u003cp>إذا كان H⊆G يحتوي المحايد، ومغلقًا تحت العملية وأخذ المعكوس، فهو زمرة جزئية.\u003c/p>\u003ch3>أمثلة\u003c/h3>\u003cp>(Z,+) زمرة، و{−1,1} زمرة جزئية من (R\\\\{0},×). كما أن زمرة التبديلات S₃ مثال منتهٍ.\u003c/p>`,example:\"في (Z,+)، المحايد هو 0 ومعكوس العدد n هو −n.\",quiz:{q:\"ما العنصر المحايد في الزمرة (Z,+)؟\",opts:[\"1\",\"−1\",\"0\",\"لا يوجد\"],a:2,why:\"لأن n+0=0+n=n لكل عدد صحيح n.\"}},\n{title:\"3. التشاكلات والزمر العاملية\",body:`\u003cp>التشاكل بين بنيتين جبريتين هو تطبيق يحافظ على العملية. في حالة الزمر، يحافظ التطبيق φ على الضرب: φ(xy)=φ(x)φ(y).\u003c/p>\u003cp>الزمرة الجزئية H تساعد على تقسيم G إلى أصناف تكافؤ. يتناول الملف الزمر العاملية (Factor groups) كعنوان ضمن هذا الفصل، دون تفصيل موسع في الصفحات المعروضة.\u003c/p>\u003cdiv class=\"card\">\u003cb>تنبيه دراسي:\u003c/b> ركّز هنا على تعريف الزمرة، الزمرة الجزئية، وفكرة الحفاظ على العملية بالتشاكل، ثم راجع تفصيل الزمر العاملية من شرح الأستاذ إذا كان مطلوبًا في المحاضرة.\u003c/div>`,example:\"التطبيق φ:(Z,+)→(Z/nZ,+) الذي يرسل العدد إلى صنفه بترديد n يحافظ على الجمع.\",quiz:{q:\"ما الخاصية الأساسية التي يحافظ عليها تشاكل الزمر؟\",opts:[\"ترتيب العناصر\",\"العملية الجبرية\",\"عدد عناصر المجموعة دائمًا\"],a:1,why:\"التشاكل يحافظ على العملية: φ(xy)=φ(x)φ(y).\"}},\n{title:\"4. الحلقات\",body:`\u003cp>يذكر فهرس الملف موضوع الحلقات (Rings) ضمن البنى الجبرية في الفصل الثاني. لكن النص المتاح في هذا الموضع يورد العنوان فقط دون عرض تعريف أو خواص مفصلة.\u003c/p>\u003cp>لذلك يثبت المختبر هذا الموضوع في خريطة المقياس، ولا ينسب إلى الملف تعريفًا تفصيليًا غير موجود في الصفحات المعروضة.\u003c/p>`,example:\"راجع محاضرة الأستاذ أو الجزء المكمل من الدرس للحصول على التعريف المعتمد للحلقة والخواص المطلوبة في مقياسك.\",quiz:{q:\"كيف عُرض موضوع الحلقات في الملف المرفق؟\",opts:[\"فصل كامل مفصل\",\"عنوان ضمن الفصل دون شرح موسع في النص المتاح\",\"غير موجود في الفهرس\"],a:1,why:\"الفهرس يذكر Rings في الفصل الثاني، والصفحة 43 تعرض عنوان 3. Rings فقط.\"}}\n]},\n{title:\"الجبر الخطي\",lessons:[\n{title:\"1. الفضاءات الشعاعية\",body:`\u003cp>يفترض الفصل أن K حقل (مثل Q أو R أو C)، وأن V مجموعة شعاعية. الفضاء الشعاعي على K هو زمرة أبيلية بالنسبة للجمع، مع عملية ضرب عدد قياسي αv تحقق:\u003c/p>\u003cdiv class=\"formula\">(α+β)u = αu + βu\u003cbr>α(u+v)=αu+αv\u003cbr>(αβ)u=α(βu)\u003cbr>1u=u\u003c/div>\u003cp>عناصر V تسمى متجهات، وعناصر K تسمى أعدادًا قياسية.\u003c/p>\u003ch3>مثال\u003c/h3>\u003cp>R² فضاء شعاعي على R، والجمع والضرب القياسي فيه يتمان مركبةً بمركبة.\u003c/p>`,example:\"إذا u=(1,2) وv=(3,−1)، فإن u+v=(4,1)، و2u=(2,4).\",quiz:{q:\"ما المتجه الصفري في R²؟\",opts:[\"(1,1)\",\"(0,0)\",\"(0,1)\",\"(−1,−1)\"],a:1,why:\"المتجه الصفري هو عنصر المحايد للجمع: (0,0).\"}},\n{title:\"2. الفضاءات الجزئية والتطبيقات الخطية\",body:`\u003cp>الفضاء الجزئي W من V هو جزء يحتفظ ببنية الفضاء الشعاعي: يحتوي المتجه الصفري، ويكون مغلقًا تحت الجمع والضرب القياسي.\u003c/p>\u003cp>التطبيق الخطي f:V→W يحافظ على الجمع والضرب القياسي:\u003c/p>\u003cdiv class=\"formula\">f(u+v)=f(u)+f(v)\u003cbr>f(αu)=αf(u)\u003c/div>\u003cp>والتماثل الخطي هو تطبيق خطي تقابلي.\u003c/p>`,example:\"التطبيق f:R²→R² المعرفة بـ f(x,y)=(2x,2y) خطي؛ لأنه يحافظ على الجمع والضرب القياسي.\",quiz:{q:\"أي شرط يعبّر عن خطية f؟\",opts:[\"f(u+v)=f(u)+f(v)\",\"f(u+v)=f(u)f(v)\",\"f(αu)=f(u)+α\"],a:0,why:\"حفظ الجمع هو أحد الشرطين الأساسيين للتطبيق الخطي، إضافة إلى حفظ الضرب القياسي.\"}},\n{title:\"3. التوليد والاستقلال والقواعد\",body:`\u003cp>التركيبة الخطية للمتجهات v₁,…,vₙ هي متجه من الشكل:\u003c/p>\u003cdiv class=\"formula\">u = α₁v₁ + α₂v₂ + ··· + αₙvₙ\u003c/div>\u003cp>مجموعة كل التركيبات الخطية تسمى الفضاء المولد Span{v₁,…,vₙ}. إذا ولّدت العائلة V فهي عائلة مولدة. والعائلة الحرة هي التي لا تملك تركيبًا خطيًا يساوي الصفر إلا عندما تكون جميع المعاملات صفرًا. القاعدة عائلة حرة ومولدة معًا.\u003c/p>\u003cp>يتناول الملف أيضًا الفضاءات العاملية والبعد للفضاءات المنتهية التوليد.\u003c/p>`,example:\"في R²، المتجهان (1,0) و(0,1) يشكلان قاعدة؛ لأن كل (x,y)=x(1,0)+y(0,1) وبشكل وحيد.\",quiz:{q:\"القاعدة في الفضاء الشعاعي هي عائلة:\",opts:[\"مولدة فقط\",\"حرة فقط\",\"حرة ومولدة معًا\"],a:2,why:\"القاعدة تحقق الشرطين: الاستقلال الخطي والتوليد.\"}},\n{title:\"4. المصفوفات والعمليات\",body:`\u003cp>المصفوفة A من الحجم n×m لها n أسطر وm أعمدة. يمكن جمع مصفوفتين من الحجم نفسه، وضرب المصفوفة في عدد قياسي، وضرب المصفوفات عندما يتوافق عدد أعمدة الأولى مع عدد أسطر الثانية.\u003c/p>\u003cdiv class=\"formula\">A ∈ Kⁿˣᵐ ، B ∈ Kᵐˣᵖ ⇒ AB ∈ Kⁿˣᵖ\u003c/div>\u003cp>تظهر المصفوفات في الملف بوصفها تمثيلًا للتطبيقات الخطية بالنسبة إلى قواعد مختارة.\u003c/p>`,example:\"إذا كانت A من الحجم 2×3 وB من الحجم 3×4، فإن AB معرف وحجمه 2×4.\",quiz:{q:\"إذا A حجمها 2×3 وB حجمها 3×4، فما حجم AB؟\",opts:[\"3×3\",\"2×4\",\"4×2\",\"2×3\"],a:1,why:\"حجم الناتج يأخذ عدد أسطر A وعدد أعمدة B: 2×4.\"}},\n{title:\"5. المصفوفات والتطبيقات الخطية\",body:`\u003cp>إذا اخترنا قاعدة في فضاء الانطلاق وقاعدة في فضاء الوصول، فإن التطبيق الخطي f:U→V يمثّل بمصفوفة A. العمود j من A يحتوي إحداثيات f(uⱼ) في قاعدة فضاء الوصول.\u003c/p>\u003cdiv class=\"formula\">M(g∘f) = M(g) · M(f)\u003c/div>\u003cp>إذن تركيب التطبيقات الخطية يقابله ضرب المصفوفات بالترتيب نفسه: مصفوفة التطبيق اللاحق على اليسار.\u003c/p>`,example:\"إذا f يمثّلها A وg يمثّلها B، فإن التطبيق g∘f تمثّله BA، وليس AB عمومًا.\",quiz:{q:\"إذا كانت f مصفوفتها A وg مصفوفتها B، فما مصفوفة g∘f؟\",opts:[\"AB\",\"BA\",\"A+B\",\"B−A\"],a:1,why:\"حسب العلاقة في الملف: M(g∘f)=M(g)·M(f)=BA.\"}},\n{title:\"6. العمليات الأولية والمحدد\",body:`\u003cp>يذكر الملف العمليات الأولية على المصفوفات والصيغة القانونية، ثم المحدد (Determinant). ويعرّف محور السطر بأنه أول عنصر غير صفري في ذلك السطر. كما يربط العمليات على المصفوفات بحل الأنظمة الخطية.\u003c/p>\u003cp>يشرح الفصل كذلك العلاقة بين المصفوفات والتطبيقات الخطية، ويعرض تمثيل التطبيقات الذاتية بمصفوفات مربعة.\u003c/p>\u003cdiv class=\"card\">\u003cb>ملاحظة:\u003c/b> بعض فقرات هذا الجزء في النسخة المرفقة مختصرة أو على هيئة عناوين، لذا أضفت خريطة مراجعة وتمارين تأسيسية دون الادعاء بأنها تغطي تفاصيل غير واردة في الملف.\u003c/div>`,example:\"المصفوفة المربعة من الرتبة n هي التي لها n أسطر وn أعمدة؛ والمحدد يرتبط بالمصفوفات المربعة.\",quiz:{q:\"المحدد يُعرّف في هذا المستوى للمصفوفات:\",opts:[\"كل المصفوفات المستطيلة\",\"المصفوفات المربعة\",\"المتجهات فقط\"],a:1,why:\"المحدد مرتبط بالمصفوفات المربعة.\"}}\n]}\n];\nlet chapter=0, lesson=0;\nconst done = new Set(JSON.parse(localStorage.getItem(\"algebra_lab_done\")||\"[]\"));\nconst list=document.getElementById(\"lessonList\"), content=document.getElementById(\"content\");\nfunction updateProgress(){\n const total=chapters.reduce((n,c)=>n+c.lessons.length,0);\n document.getElementById(\"progressText\").textContent=done.size+\" من \"+total+\" دروس\";\n document.getElementById(\"progressBar\").style.width=(done.size/total*100)+\"%\";\n}\nfunction render(){\n const c=chapters[chapter], l=c.lessons[lesson];\n document.getElementById(\"sideTitle\").textContent=\"الفصل \"+(chapter+1)+\": \"+c.title;\n list.innerHTML=\"\";\n c.lessons.forEach((x,i)=>{const b=document.createElement(\"button\");b.textContent=(done.has(chapter+\"-\"+i)?\"✓ \":\"\")+x.title;b.className=i===lesson?\"active\":\"\";b.onclick=()=>{lesson=i;render()};list.appendChild(b)});\n content.innerHTML=`\u003cspan class=\"tag\">الفصل ${chapter+1} · الدرس ${lesson+1}\u003c/span>\u003ch2 style=\"margin-top:10px\">${l.title}\u003c/h2>${l.body}\u003cdiv class=\"card\">\u003ch3>مثال توضيحي\u003c/h3>\u003cp>${l.example}\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>اختبر فهمك\u003c/h3>\u003cp>\u003cb>${l.quiz.q}\u003c/b>\u003c/p>\u003cdiv id=\"opts\">\u003c/div>\u003cdiv id=\"feedback\">\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"mark\">تمت مراجعة الدرس ✓\u003c/button>\u003cbutton id=\"prev\">الدرس السابق\u003c/button>\u003cbutton id=\"next\">الدرس التالي\u003c/button>\u003c/div>`;\n l.quiz.opts.forEach((o,i)=>{const b=document.createElement(\"button\");b.className=\"option\";b.textContent=(i+1)+\". \"+o;b.onclick=()=>{const f=document.getElementById(\"feedback\");f.className=\"feedback \"+(i===l.quiz.a?\"good\":\"bad\");f.textContent=(i===l.quiz.a?\"إجابة صحيحة! \":\"ليست الإجابة الصحيحة. \")+l.quiz.why};document.getElementById(\"opts\").appendChild(b)});\n document.getElementById(\"mark\").onclick=()=>{done.add(chapter+\"-\"+lesson);localStorage.setItem(\"algebra_lab_done\",JSON.stringify([...done]));render();updateProgress()};\n document.getElementById(\"prev\").onclick=()=>{if(lesson>0){lesson--;render()}else if(chapter>0){chapter--;lesson=chapters[chapter].lessons.length-1;setChapterButtons();render()}};\n document.getElementById(\"next\").onclick=()=>{if(lesson\u003cc.lessons.length-1){lesson++;render()}else if(chapter\u003cchapters.length-1){chapter++;lesson=0;setChapterButtons();render()}};\n updateProgress();\n}\nfunction setChapterButtons(){document.querySelectorAll(\"[data-ch]\").forEach(b=>b.classList.toggle(\"active\",Number(b.dataset.ch)===chapter))}\ndocument.querySelectorAll(\"[data-ch]\").forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.ch);lesson=0;setChapterButtons();render()});\nrender();updateProgress();\n\u003c/script>\u003c/body>\u003c/html>"}, {"name": "الخوارزميات و C", "note": "ADS1", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>مختبر الخوارزميات و C — ADS1\u003c/title>\n\u003cstyle>\n:root{--bg:#f5f7fb;--cd:#fff;--tx:#1b2233;--mu:#667;--ac:#3b5bdb;--ok:#2b9348;--bad:#d62828;--bd:#e0e4f0;--hl:#fff3bf;--cb:#f1f3f9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#12151f;--cd:#1b2030;--tx:#e8ebf5;--mu:#9aa3bd;--ac:#7c9bff;--ok:#5ad27a;--bad:#ff6b6b;--bd:#2d3450;--hl:#4a4310;--cb:#151a29;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#12151f;--cd:#1b2030;--tx:#e8ebf5;--mu:#9aa3bd;--ac:#7c9bff;--ok:#5ad27a;--bad:#ff6b6b;--bd:#2d3450;--hl:#4a4310;--cb:#151a29;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,\"Segoe UI\",Tahoma,sans-serif;line-height:1.7}\nmain{max-width:900px;margin:auto;padding:12px}\nh1{font-size:1.3rem;margin:6px 0}h3{margin:0 0 6px;font-size:1.05rem}\n.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}\n.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}\nbutton,input,select{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:5px 10px}\nbutton{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.45}\n.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:640px){.g{grid-template-columns:1fr}}\npre{direction:ltr;text-align:left;background:var(--cb);border-radius:8px;padding:8px;margin:2px 0;overflow-x:auto;font-size:.85rem;line-height:1.5}\n.ln{display:block;white-space:pre;padding:0 4px;border-radius:4px}.ln.hl{background:var(--hl)}\n.ln2{direction:ltr;font-family:monospace;font-size:.85rem}\n.mu{color:var(--mu);font-size:.85rem}.ok{color:var(--ok)}.bad{color:var(--bad)}\nlabel{display:block;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer;direction:ltr;text-align:left}\n.pt{padding:2px 8px;border:1px solid var(--bd);border-radius:8px;direction:ltr;background:var(--cb)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:8px;background:var(--ok)}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003ch1>💻 مختبر الخوارزميات و C — ADS1\u003c/h1>\n\u003cp class=\"mu\">تعلّم بالممارسة: اقرأ البطاقة، تتبّع التنفيذ سطرا بسطر، رتّب الكود، ثم اختبر نفسك. كل مثال بالخوارزمية (pseudocode) وبلغة C معا.\u003c/p>\n\u003cdiv class=\"row\" id=\"nav\">\u003c/div>\u003cdiv id=\"v\">\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s),R=String.raw;\nconst esc=s=>String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nlet st={};try{st=JSON.parse(localStorage.getItem(\"ads1\")||\"{}\")}catch(e){}\nconst sv=()=>{try{localStorage.setItem(\"ads1\",JSON.stringify(st))}catch(e){}};\nconst tabs=[[\"path\",\"🚀 المسار\"],[\"trace\",\"🔍 المتتبّع\"],[\"ordr\",\"🧩 رتّب الكود\"],[\"exam\",\"🎓 مسألة المنحة\"]];\nfunction go(t){$(\"#nav\").innerHTML=tabs.map(([k,n])=>`\u003cbutton class=\"${k==t?'p':''}\" onclick=\"go('${k}')\">${n}\u003c/button>`).join(\"\");({path,trace,ordr,exam})[t]()}\nconst ln=(t,h)=>t.split(\"\\n\").map((l,i)=>`\u003cspan class=\"ln${i==h?' hl':''}\">${esc(l)||' '}\u003c/span>`).join(\"\");\n\nconst L=[\n{t:\"1. الأساسيات\",cards:[\n[\"المتغيرات والأنواع\",\"المتغير علبة لها اسم ونوع وقيمة. اختر النوع حسب ما تخزّنه: عدد صحيح، عدد عشري، حرف، أو نص.\",R`Var a: integer; x: real;\nVar c: char; s: string;`,R`int a; float x;\nchar c; char s[20];`],\n[\"الإسناد والحساب\",\"السهم ← في الخوارزمية يصبح = في C. القسمة الصحيحة div والباقي mod يصبحان / و % بين عددين صحيحين.\",R`a \u003c- 7 div 2;   { 3 }\nb \u003c- 7 mod 2;   { 1 }`,R`a = 7 / 2;   /* 3 */\nb = 7 % 2;   /* 1 */`],\n[\"الإدخال والإخراج\",\"Read يقابل scanf (انتبه إلى &amp; قبل اسم المتغير)، وDisplay يقابل printf مع محدد الصيغة: ‎%d صحيح، ‎%f عشري، ‎%c حرف، ‎%s نص.\",R`Read(a);\nDisplay(\"a = \", a);`,R`scanf(\"%d\", &a);\nprintf(\"a = %d\\n\", a);`]],\nq:[[\"بعد: x←4; y←x+3; z←y*2; x←y+z; y←x+1 كم قيمة y؟\",[\"15\",\"22\",\"21\",\"14\"],1,\"x=4، y=7، z=14، x=21، y=22.\"],\n[\"في C: int a = 7 / 2; ما قيمة a؟\",[\"3.5\",\"4\",\"3\",\"خطأ\"],2,\"قسمة عددين صحيحين تعطي عددا صحيحا والجزء الكسري يُحذف.\"],\n[\"أيّ استدعاء صحيح لقراءة عدد صحيح a؟\",['scanf(\"%d\", a);','scanf(\"%d\", &a);','scanf(\"%f\", &a);',\"read(a);\"],1,\"scanf تحتاج عنوان المتغير (&a) والمحدد ‎%d للصحيح.\"]]},\n{t:\"2. الشروط\",cards:[\n[\"If و If-else\",\"If ينفّذ الكتلة إذا تحقق الشرط، وelse للحالة المعاكسة.\",R`If N >= 10 then\n  Display(\"Pass\");\nelse\n  Display(\"Fail\");\nend if`,R`if (N >= 10) {\n  printf(\"Pass\");\n} else {\n  printf(\"Fail\");\n}`],\n[\"سلسلة else if\",\"تُفحص الشروط من الأعلى وأول شرط صحيح ينفَّذ فقط ثم تنتهي السلسلة. رتّب الشروط من الأضيق إلى الأوسع.\",R`If F >= 16 then g \u003c- \"Excellent\";\nelse if F >= 14 then g \u003c- \"Very Good\";\nelse g \u003c- \"Pass\";\nend if`,R`if (F >= 16) g = \"Excellent\";\nelse if (F >= 14) g = \"Very Good\";\nelse g = \"Pass\";`],\n[\"الشروط المركبة\",\"and و or و not تصبح && و || و ! في C. وفي C: = إسناد و== مقارنة (خطأ شائع جدا).\",R`If (att >= 50) and (ex >= 5) then\n  ok \u003c- true;\nend if`,R`if (att >= 50 && ex >= 5) {\n  ok = 1;\n}`],\n[\"Case / switch\",\"اختيار حسب قيمة واحدة (رقم أو حرف). في C لا تنسَ break وإلا يسقط التنفيذ إلى الحالة التالية.\",R`Case cat of\n  'R': Display(\"None\");\n  'S': Display(\"Check\");\n  else Display(\"Other\");\nend case`,R`switch (cat) {\n  case 'R': printf(\"None\"); break;\n  case 'S': printf(\"Check\"); break;\n  default: printf(\"Other\");\n}`]],\nq:[[\"في C: if (x = 5) ... ماذا يحدث؟\",[\"يقارن x مع 5\",\"يسند 5 إلى x والشرط صحيح دائما\",\"خطأ ترجمة دائما\",\"الشرط خاطئ دائما\"],1,\"= إسناد و== مقارنة. القيمة 5 غير صفرية فتُعدّ صحيحة.\"],\n[\"F=15 و If F>=10 'Pass' else if F>=14 'Good'. ماذا يُعرض؟\",[\"Good\",\"Pass\",\"Pass ثم Good\",\"لا شيء\"],1,\"أول شرط صحيح ينفَّذ وتنتهي السلسلة، لذا نكتب F>=14 أولا.\"],\n[\"switch(c){case 'a': printf(\\\"A\\\"); case 'b': printf(\\\"B\\\"); break;} و c='a'. ماذا يُطبع؟\",[\"A\",\"B\",\"AB\",\"لا شيء\"],2,\"غياب break يجعل التنفيذ يسقط من case 'a' إلى case 'b'.\"]]},\n{t:\"3. الحلقات\",cards:[\n[\"For: العدد معروف\",\"استعملها حين تعرف عدد التكرارات مسبقا. في C: بداية؛ شرط؛ تحديث.\",R`for I \u003c- 1 to N do\n  Display(I);\nend`,R`for (i = 1; i \u003c= N; i++) {\n  printf(\"%d \", i);\n}`],\n[\"While: اختبر ثم نفّذ\",\"الشرط يُفحص قبل الجسم، فقد لا تُنفَّذ الحلقة أبدا. لا تنسَ تحديث المتغير وإلا تصير لانهائية.\",R`While N \u003c> 0 do\n  S \u003c- S + N mod 10;\n  N \u003c- N div 10;\nend`,R`while (N != 0) {\n  S = S + N % 10;\n  N = N / 10;\n}`],\n[\"Repeat-Until\",\"ينفّذ الجسم مرة على الأقل. شرط التوقف في Until هو نفي شرط الاستمرار في do-while.\",R`I \u003c- 10;\nRepeat\n  Display(I);\n  I \u003c- I - 1;\nUntil I \u003c 1;`,R`I = 10;\ndo {\n  printf(\"%d \", I);\n  I = I - 1;\n} while (I >= 1);`],\n[\"حلقات متداخلة\",\"حلقة داخل حلقة: الداخلية تكمل دورتها كاملة مع كل دورة للخارجية. تُستعمل للجداول والمصفوفات الثنائية.\",R`for I \u003c- 1 to 3 do\n  for J \u003c- 1 to 3 do\n    Display(I * J);\n  end\nend`,R`for (i = 1; i \u003c= 3; i++)\n  for (j = 1; j \u003c= 3; j++)\n    printf(\"%d \", i * j);`]],\nq:[[\"I←5; While I>=1 do ... I←I-1; end. كم مرة تُنفَّذ الحلقة؟\",[\"4\",\"5\",\"6\",\"0\"],1,\"I=5،4،3،2،1 ثم يصبح 0 فتتوقف: 5 مرات.\"],\n[\"Repeat ... Until I \u003c 1; يقابله في C:\",[\"while (I \u003c 1) {...}\",\"do {...} while (I >= 1);\",\"do {...} while (I \u003c 1);\",\"for (;I\u003c1;)\"],1,\"Until يتوقف عند تحقق الشرط، فالاستمرار هو نفيه: I >= 1.\"],\n[\"N=20 والكود for (i=1; i\u003cN/2; i++) if (N%i==0) printf(...). هل يظهر القاسم 10؟\",[\"نعم\",\"لا، لأن الحد يستبعد N/2\",\"فقط إن كان N فرديا\",\"خطأ ترجمة\"],1,\"i\u003c10 لا يبلغ 10، والصحيح i \u003c= N/2. (شريحة C في المحاضرة تستعمل i\u003cN/2.)\"]]},\n{t:\"4. المصفوفات\",cards:[\n[\"التصريح والفهرس\",\"المصفوفة سلسلة عناصر من نفس النوع. الفهرس في الخوارزمية يبدأ من 1 وفي C من 0، وC لا ينبّهك عند الخروج من الحدود.\",R`Var T: array[1..5] of integer;\nT[1] \u003c- 10;  { الأول }`,R`int T[5];\nT[0] = 10;   /* الأول، آخر فهرس 4 */`],\n[\"المرور على العناصر\",\"حلقة for هي الأداة الأساسية: قراءة، عرض، جمع.\",R`for I \u003c- 1 to 5 do\n  Read(T[I]);\nend`,R`for (i = 0; i \u003c 5; i++) {\n  scanf(\"%d\", &T[i]);\n}`],\n[\"أنماط شائعة\",\"المجموع والأكبر والبحث الخطي. في البحث نوقف الحلقة بمتغير منطقي Found.\",R`Found \u003c- false; I \u003c- 1;\nWhile (I \u003c= 5) and (not Found) do\n  If T[I] = X then Found \u003c- true;\n  end if\n  I \u003c- I + 1;\nend`,R`int found = 0;\nfor (i = 0; i \u003c 5 && !found; i++)\n  if (T[i] == x) found = 1;`]],\nq:[[\"int T[5]; آخر فهرس صالح في C؟\",[\"5\",\"4\",\"6\",\"0\"],1,\"الفهارس 0..4، والوصول إلى T[5] خارج الحدود.\"],\n[\"T={4,9,2,7,5}. بعد Max←T[1] والمرور من 2 إلى 5 بشرط T[I]>Max، قيمة Max؟\",[\"9\",\"7\",\"5\",\"4\"],0,\"نقارن كل عنصر بأكبر قيمة حتى الآن، وأكبرها 9.\"],\n[\"أيّ حلقة C تقرأ العناصر الخمسة كلها؟\",[\"for (i=1;i\u003c=5;i++)\",\"for (i=0;i\u003c5;i++)\",\"for (i=0;i\u003c=5;i++)\",\"for (i=1;i\u003c5;i++)\"],1,\"الفهارس 0..4: نبدأ من 0 ونتوقف قبل 5.\"]]},\n{t:\"5. ثنائية ونصوص\",cards:[\n[\"المصفوفة الثنائية\",\"جدول أسطر × أعمدة: M[سطر][عمود]. تُقرأ بحلقتين متداخلتين.\",R`Var M: array[1..3,1..4] of integer;\nM[2,3] \u003c- 7;`,R`int M[3][4];\nM[1][2] = 7;   /* السطر 2، العمود 3 */`],\n[\ ] .formula{background:var(--soft);color:var(--ink)}:root[data-theme=\"dark\"] .progress{background:var(--line)}:root[data-theme=\"dark\"] .tag{color:#b9c9ff}:root[data-theme=\"dark\"] button.active,:root[data-theme=\"dark\"] .primary{color:#0b1226}:root[data-theme=\"dark\"] .lesson-list button.active{color:#b9c9ff;border-color:#4a63b5;background:var(--soft)}:root[data-theme=\"dark\"] input,:root[data-theme=\"dark\"] select{background:var(--card);color:var(--ink)}:root[data-theme=\"dark\"] table.t th{background:var(--soft)}\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\n\u003ch1>مختبر هندسة الحواسيب التفاعلي\u003c/h1>\n\u003cp>Computer Architecture — Toumi, Univ. Kasdi Merbah | شرح عربي، أمثلة، تمارين واختبارات\u003c/p>\n\u003c/div>\u003c/header>\n\u003cmain class=\"wrap\">\n\u003cnav id=\"chapters\">\n\u003cbutton class=\"active\" data-ch=\"0\">الفصل 1: أنظمة العد\u003c/button>\n\u003cbutton data-ch=\"1\">الفصل 2: الأعداد الصحيحة المؤشرة\u003c/button>\n\u003cbutton data-ch=\"2\">الفصل 3: الترميز\u003c/button>\n\u003cbutton data-ch=\"3\">الفصل 4: جبر بول\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"card\">\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap\">\u003cstrong>تقدمك في المختبر\u003c/strong>\u003cspan id=\"progressText\" class=\"muted\">0 من 26 درسًا\u003c/span>\u003c/div>\n\u003cdiv class=\"progress\">\u003cspan id=\"progressBar\">\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"layout\">\n\u003caside>\u003ch3 id=\"sideTitle\">الفصل الأول\u003c/h3>\u003cdiv class=\"lesson-list\" id=\"lessonList\">\u003c/div>\n\u003cp class=\"muted\" style=\"font-size:12px\">يُحفظ تقدم الدروس على هذا المتصفح.\u003c/p>\u003c/aside>\n\u003csection class=\"panel\" id=\"content\" aria-live=\"polite\">\u003c/section>\n\u003c/div>\n\u003c/main>\n\u003cfooter>المختبر مبني على ملفات CHAP01 وCHAP2 وCHAP_03 وCh04-Boolean_Algebra المرفقة. صُحّح خطأ مطبعي في شريحة BCD (العدد 23 يساوي 10111 ثنائيًا، وتمثيله BCD هو 0010 0011).\u003c/footer>\n\u003cscript>\nconst chapters = [\n{title:\"أنظمة العد\", lessons:[\n{title:\"1. مفهوم نظام العد\",body:`\u003cp>نظام العد طريقة لكتابة الأعداد وتمثيلها برموز وفق قواعد ثابتة. يتحدد النظام بـ \u003cb>الأساس\u003c/b> (عدد الرموز المختلفة)، و\u003cb>الأبجدية\u003c/b> (مجموعة الرموز)، وقواعد الكتابة والعمليات.\u003c/p>\u003cdiv class=\"formula\">N\u003csub>B\u003c/sub> = Σ aᵢ·Bⁱ = aₙ₋₁Bⁿ⁻¹ + … + a₁B¹ + a₀B⁰\u003c/div>\u003cp>الرقم aₙ₋₁ هو الأكثر أهمية (MSD) والرقم a₀ هو الأقل أهمية (LSD)، ولكل رقم وزن موضعي. ولتجنب الالتباس نحدد الأساس دائمًا:\u003c/p>\u003cdiv class=\"formula\">(100)₂ ≠ (100)₁₀ ≠ (100)₁₆\u003c/div>`,example:\"(1101)₂ = 1·2³ + 1·2² + 0·2¹ + 1·2⁰ = 8+4+0+1 = 13.\",quiz:{q:\"ما قيمة (1011)₂ بالعشري؟\",opts:[\"9\",\"10\",\"11\",\"13\"],a:2,why:\"1·8 + 0·4 + 1·2 + 1·1 = 11.\"}},\n{title:\"2. الأنظمة الشائعة\",body:`\u003cul>\u003cli>\u003cb>العشري (10):\u003c/b> الأبجدية {0…9}، ونستعمله في الحياة اليومية.\u003c/li>\u003cli>\u003cb>الثنائي (2):\u003c/b> {0,1}، وهو لغة الحاسوب.\u003c/li>\u003cli>\u003cb>الثماني (8):\u003c/b> {0…7}.\u003c/li>\u003cli>\u003cb>السداسي عشر (16):\u003c/b> {0…9, A…F} حيث A=10 … F=15.\u003c/li>\u003c/ul>\u003ctable class=\"t\">\u003ctr>\u003cth>10\u003c/th>\u003cth>8\u003c/th>\u003cth>16\u003c/th>\u003cth>2\u003c/th>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>7\u003c/td>\u003ctd>7\u003c/td>\u003ctd>111\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>10\u003c/td>\u003ctd>8\u003c/td>\u003ctd>1000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>12\u003c/td>\u003ctd>A\u003c/td>\u003ctd>1010\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>17\u003c/td>\u003ctd>F\u003c/td>\u003ctd>1111\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16\u003c/td>\u003ctd>20\u003c/td>\u003ctd>10\u003c/td>\u003ctd>10000\u003c/td>\u003c/tr>\u003c/table>`,example:\"الرمز B في النظام السداسي عشر قيمته 11، وتمثيله الثنائي 1011.\",quiz:{q:\"كم رمزًا في أبجدية النظام السداسي عشر؟\",opts:[\"8\",\"10\",\"16\",\"15\"],a:2,why:\"الأساس 16 يعني 16 رمزًا: من 0 إلى 9 ثم A إلى F.\"}},\n{title:\"3. التحويل إلى العشري\",body:`\u003cp>كل نظام موضعي، فنحسب القيمة العشرية بالصيغة الحدودية: نضرب كل رقم في وزنه Bⁱ ثم نجمع.\u003c/p>\u003cdiv class=\"formula\">(aₙ…a₁a₀)\u003csub>B\u003c/sub> → aₙ·Bⁿ + … + a₁·B + a₀\u003c/div>`,example:\"(2A)₁₆ = 2·16 + 10 = 42 ، و(157)₈ = 1·64 + 5·8 + 7 = 111.\",quiz:{q:\"ما قيمة (17)₈ بالعشري؟\",opts:[\"15\",\"17\",\"7\",\"23\"],a:0,why:\"1·8 + 7 = 15.\"}},\n{title:\"4. من العشري إلى أساس B\",body:`\u003cp>نقسم العدد على الأساس قسمة صحيحة متتالية حتى يصبح الناتج صفرًا. الباقي الأول هو الرقم الأقل أهمية، فنقرأ البواقي من الأسفل إلى الأعلى.\u003c/p>\u003cdiv class=\"formula\">45 ÷ 2 = 22 r1 → 11 r0 → 5 r1 → 2 r1 → 1 r0 → 0 r1\u003cbr>(45)₁₀ = (101101)₂\u003c/div>\u003cdiv class=\"card\">\u003ch3>محوّل أنظمة العد\u003c/h3>\u003cinput id=\"cvn\" value=\"45\" oninput=\"cvt()\" style=\"width:130px\" dir=\"ltr\"> من أساس \u003cselect id=\"cvf\" onchange=\"cvt()\">\u003coption>10\u003c/option>\u003coption>2\u003c/option>\u003coption>8\u003c/option>\u003coption>16\u003c/option>\u003c/select> إلى أساس \u003cselect id=\"cvg\" onchange=\"cvt()\">\u003coption>2\u003c/option>\u003coption>8\u003c/option>\u003coption>16\u003c/option>\u003coption>10\u003c/option>\u003c/select>\u003cdiv id=\"cvo\" class=\"formula\">\u003c/div>\u003c/div>`,example:\"13 ÷ 2 = 6 r1 ، 6 ÷ 2 = 3 r0 ، 3 ÷ 2 = 1 r1 ، 1 ÷ 2 = 0 r1، فنقرأ من الأسفل: (1101)₂.\",quiz:{q:\"ما تمثيل العدد 10 في النظام الثنائي؟\",opts:[\"1001\",\"1010\",\"1100\",\"1110\"],a:1,why:\"8 + 2 = 10 أي 1010.\"}},\n{title:\"5. التحويل المباشر بين 2 و8 و16\",body:`\u003cp>لا توجد طريقة مباشرة بين أي أساسين عمومًا، فنمر بالعشري. لكن بين الثنائي والثماني والسداسي عشر توجد طريقة بسيطة لأن 8=2³ و16=2⁴:\u003c/p>\u003cul>\u003cli>\u003cb>ثنائي ← ثماني:\u003c/b> نجمّع كل 3 بتات من اليمين.\u003c/li>\u003cli>\u003cb>ثنائي ← سداسي عشر:\u003c/b> نجمّع كل 4 بتات من اليمين.\u003c/li>\u003cli>\u003cb>العكس:\u003c/b> نبدل كل رقم بمكافئه من 3 أو 4 بتات.\u003c/li>\u003c/ul>`,example:\"(101101)₂ = (101)(101) = (55)₈ ، و(0010)(1101) = (2D)₁₆. وكلاهما يساوي 45.\",quiz:{q:\"ما قيمة (11110110)₂ بالنظام السداسي عشر؟\",opts:[\"E6\",\"F6\",\"F5\",\"76\"],a:1,why:\"1111 = F و0110 = 6.\"}},\n{title:\"6. العمليات الحسابية الثنائية\",body:`\u003cp>المبادئ نفسها كما في العشري، من اليمين إلى اليسار مع حمل (Carry) أو استلاف (Borrow).\u003c/p>\u003ctable class=\"t\">\u003ctr>\u003cth>X\u003c/th>\u003cth>Y\u003c/th>\u003cth>X+Y\u003c/th>\u003cth>Carry\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/table>\u003cp>الضرب كالعشري: 1×1=1 وغير ذلك 0. والقسمة تبدأ من البت الأكثر أهمية.\u003c/p>`,example:\"1011 + 0110 = 10001 لأن 11 + 6 = 17.\",quiz:{q:\"ما ناتج 1101 + 0011؟\",opts:[\"10000\",\"1110\",\"10010\",\"1111\"],a:0,why:\"13 + 3 = 16 وهو 10000.\"}}\n]},\n{title:\"الأعداد الصحيحة المؤشرة\", lessons:[\n{title:\"1. لماذا نحتاج إشارة؟\",body:`\u003cp>الحاسوب لا يخزن الإشارة (−) كرمز، فنخصص لها بتًا هو \u003cb>بت الإشارة\u003c/b> (MSB): إذا كان 1 فالعدد سالب، وإذا كان 0 فهو موجب. وبقية البتات تمثل القيمة.\u003c/p>\u003cp>قبل أي عملية يجب تحديد عدد البتات n. ولغير المؤشر على n بتًا:\u003c/p>\u003cdiv class=\"formula\">0 ≤ X ≤ 2ⁿ − 1\u003c/div>\u003cp>وقد يحدث \u003cb>طفحان\u003c/b> (Overflow) إذا خرج الناتج عن المجال.\u003c/p>`,example:\"على 8 بتات غير مؤشرة المجال من 0 إلى 255.\",quiz:{q:\"ما المجال غير المؤشر على 4 بتات؟\",opts:[\"0 إلى 15\",\"0 إلى 16\",\"−8 إلى 7\",\"1 إلى 15\"],a:0,why:\"2⁴ − 1 = 15.\"}},\n{title:\"2. الإشارة والقيمة المطلقة\",body:`\u003cp>بت للإشارة والبقية (n−1) للقيمة المطلقة.\u003c/p>\u003cdiv class=\"formula\">−(2ⁿ⁻¹ − 1) ≤ X ≤ +(2ⁿ⁻¹ − 1)\u003c/div>\u003cp>العيبان: للصفر تمثيلان (+0 و−0)، والعمليات الحسابية تحتاج معالجة خاصة لبت الإشارة.\u003c/p>`,example:\"على 4 بتات: +4 = 0100 و−4 = 1100، والمجال من −7 إلى +7.\",quiz:{q:\"ماذا يمثل 10000 في الإشارة والقيمة المطلقة على 5 بتات؟\",opts:[\"−16\",\"−0\",\"−1\",\"+16\"],a:1,why:\"بت الإشارة 1 والقيمة 0000 أي −0.\"}},\n{title:\"3. المتمم إلى 1\",body:`\u003cp>الموجب كما في الإشارة والقيمة المطلقة، والسالب نحصل عليه بقلب كل بتات الموجب (0↔1). بت الإشارة هو MSB.\u003c/p>\u003cp>للصفر تمثيلان أيضًا، والمجال نفسه: −(2ⁿ⁻¹−1) إلى +(2ⁿ⁻¹−1). وفي الجمع يُضاف الحمل الخارج من بت الإشارة إلى النتيجة (end-around carry).\u003c/p>`,example:\"على 8 بتات: +5 = 00000101 فيكون −5 = 11111010.\",quiz:{q:\"ما المتمم إلى 1 للعدد 0110؟\",opts:[\"1001\",\"1010\",\"0110\",\"1000\"],a:0,why:\"نقلب كل بت: 0110 → 1001.\"}},\n{title:\"4. المتمم إلى 2\",body:`\u003cp>هو الطريقة المستعملة في الحواسيب. السالب = المتمم إلى 1 + 1. للصفر تمثيل وحيد.\u003c/p>\u003cdiv class=\"formula\">−2ⁿ⁻¹ ≤ X ≤ +(2ⁿ⁻¹ − 1)\u003c/div>\u003cp>لفك عدد سالب: نقلب بتاته ونضيف 1 ثم نضع إشارة (−).\u003c/p>`,example:\"على 8 بتات: +5 = 00000101، قلبه 11111010، نضيف 1 فنحصل على −5 = 11111011.\",quiz:{q:\"ما المجال على 8 بتات بالمتمم إلى 2؟\",opts:[\"−127 إلى 127\",\"−128 إلى 127\",\"−128 إلى 128\",\"0 إلى 255\"],a:1,why:\"−2⁷ = −128 و2⁷ − 1 = 127.\"}},\n{title:\"5. الجمع والطرح بالمتمم إلى 2\",body:`\u003cul>\u003cli>\u003cb>الجمع:\u003c/b> نجمع كل البتات بما فيها الإشارة، ونتجاهل الحمل الخارج من بت الإشارة.\u003c/li>\u003cli>\u003cb>الطرح:\u003c/b> a − b = a + (−b).\u003c/li>\u003cli>\u003cb>الطفحان:\u003c/b> يحدث إذا جمعنا عددين لهما الإشارة نفسها فخرجت نتيجة بإشارة معاكسة (أو إذا اختلف الحمل الداخل إلى بت الإشارة عن الحمل الخارج منه).\u003c/li>\u003c/ul>`,example:\"على 4 بتات: 3 + (−5) = 0011 + 1011 = 1110 = −2 ✓. وعلى 4 بتات: 7 + 3 = 0111 + 0011 = 1010 وهو سالب، فهذا طفحان لأن 10 خارج المجال [−8, 7].\",quiz:{q:\"في المتمم إلى 2 على 4 بتات، ما ناتج 0111 + 0001؟\",opts:[\"1000 وهو +8\",\"1000 وهو −8 أي طفحان\",\"0000\",\"1111\"],a:1,why:\"7 + 1 = 8 خارج المجال، فتظهر 1000 التي تساوي −8.\"}},\n{title:\"6. مقارنة الطرق الثلاث\",body:`\u003ctable class=\"t\">\u003ctr>\u003cth>النمط (4 بتات)\u003c/th>\u003cth>إشارة وقيمة\u003c/th>\u003cth>متمم 1\u003c/th>\u003cth>متمم 2\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0111\u003c/td>\u003ctd>+7\u003c/td>\u003ctd>+7\u003c/td>\u003ctd>+7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1000\u003c/td>\u003ctd>−0\u003c/td>\u003ctd>−7\u003c/td>\u003ctd>−8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1001\u003c/td>\u003ctd>−1\u003c/td>\u003ctd>−6\u003c/td>\u003ctd>−7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1111\u003c/td>\u003ctd>−7\u003c/td>\u003ctd>−0\u003c/td>\u003ctd>−1\u003c/td>\u003c/tr>\u003c/table>\u003cp>الضرب: نضرب القيم المطلقة ثم نطبق الإشارة (مختلفتا الإشارة تعطيان ناتجًا سالبًا). والقسمة بالمثل.\u003c/p>`,example:\"النمط 1111 يمثل −7 في الإشارة والقيمة، و−0 في المتمم إلى 1، و−1 في المتمم إلى 2.\",quiz:{q:\"أي الطرق الثلاث لها تمثيل وحيد للصفر؟\",opts:[\"الإشارة والقيمة\",\"المتمم إلى 1\",\"المتمم إلى 2\",\"جميعها\"],a:2,why:\"الأوليان تمثلان +0 و−0 بنمطين مختلفين.\"}}\n]},\n{title:\"الترميز\", lessons:[\n{title:\"1. مفهوم الترميز وأنواعه\",body:`\u003cp>الترميز إسناد \u003cb>كلمة رمزية\u003c/b> (code word) لكل معلومة (رقم، حرف، رمز). وفي الآلة كل الرموز ثنائية. وتنقسم الشفرات إلى:\u003c/p>\u003cul>\u003cli>\u003cb>موضعية (Positional):\u003c/b> لكل موضع وزن ثابت، مثل الثنائي الصرف وBCD وAiken.\u003c/li>\u003cli>\u003cb>غير موضعية:\u003c/b> لا أوزان، وتبنى جدولًا خاصًا بالتطبيق، مثل Excess-3 وGray.\u003c/li>\u003c/ul>`,example:\"في الثنائي الصرف الأوزان 1، 2، 4، 8 …، وفي العشري 1، 10، 100 ….\",quiz:{q:\"أي الشفرات التالية موضعية؟\",opts:[\"Gray\",\"Excess-3\",\"BCD\",\"ASCII فقط\"],a:2,why:\"BCD لكل بت وزن ثابت (8-4-2-1).\"}},\n{title:\"2. الترميز BCD\",body:`\u003cp>كل رقم عشري (0…9) يُرمَّز بـ 4 بتات (0000 إلى 1001). يستعمل في الشاشات والعدادات والآلات الحاسبة لتجنب التحويل بين العشري والثنائي.\u003c/p>\u003cp>الحالات 1010 إلى 1111 (ست حالات) \u003cb>ممنوعة\u003c/b> في BCD. وتمثيل BCD يختلف عن الثنائي الصرف.\u003c/p>`,example:\"93 = (1011101)₂ لكن 93 في BCD = 1001 0011. وكذلك 23 في BCD = 0010 0011.\",quiz:{q:\"ما تمثيل العدد 47 في BCD؟\",opts:[\"0100 0111\",\"101111\",\"0111 0100\",\"0100 1111\"],a:0,why:\"نرمّز كل رقم على حدة: 4 = 0100 و7 = 0111.\"}},\n{title:\"3. شفرتا Aiken وExcess-3\",body:`\u003cp>\u003cb>Aiken (2421):\u003c/b> أوزان البتات 2،4،2،1، وهي موضعية ومتممة ذاتيًا. من 0 إلى 4 مثل BCD، ومن 5 إلى 9 هي 1011 إلى 1111.\u003c/p>\u003cp>\u003cb>Excess-3 (Stibitz):\u003c/b> نضيف 3 لكل رقم BCD ثم نكتبه بـ 4 بتات، وهي غير موضعية.\u003c/p>`,example:\"129 في Excess-3: الأرقام 1،2،9 تصبح 4،5،12 أي 0100 0101 1100. وفي Aiken العدد 7 هو 1101 لأن 2+4+1 = 7.\",quiz:{q:\"ما تمثيل الرقم 5 في Excess-3؟\",opts:[\"0101\",\"1000\",\"1011\",\"0011\"],a:1,why:\"5 + 3 = 8 أي 1000.\"}},\n{title:\"4. شفرة Gray\",body:`\u003cp>شفرة متجاورة: يتغير \u003cb>بت واحد فقط\u003c/b> عند الانتقال من قيمة إلى التالية، فتمنع الحالات الطفيلية وتناسب خرائط كارنو.\u003c/p>\u003cdiv class=\"formula\">g = b ⊕ (b ≫ 1) &nbsp;;&nbsp; bᵢ = bᵢ₊₁ ⊕ gᵢ\u003c/div>\u003cp>أول بت في Gray يساوي أول بت في الثنائي، وكل بت لاحق = XOR بين بتين متجاورين من الثنائي. والبناء بالانعكاس: ننسخ شفرة n−1 بادئين بـ 0 ثم ننسخها معكوسة بادئين بـ 1. وأول 8 كلمات: 000، 001، 011، 010، 110، 111، 101، 100.\u003c/p>`,example:\"N = 0111: N ⊕ (N≫1) = 0111 ⊕ 0011 = 0100. وكذلك 10 = 1010 → 1111، و15 = 1111 → 1000.\",quiz:{q:\"ما شفرة Gray للعدد الثنائي 0110؟\",opts:[\"0101\",\"0111\",\"1010\",\"0011\"],a:0,why:\"0110 ⊕ 0011 = 0101.\"}},\n{title:\"5. كشف الأخطاء\",body:`\u003cul>\u003cli>\u003cb>بت التماثل (Parity):\u003c/b> بت إضافي P يجعل عدد الواحدات زوجيًا (even) أو فرديًا (odd). يكشف خطأ واحدًا فقط ولا يصححه.\u003c/li>\u003cli>\u003cb>مجموع التحقق (Checksum):\u003c/b> نجمع كلمات البيانات ونرسل المجموع، ثم يعيد المستقبل الجمع ويقارن.\u003c/li>\u003cli>\u003cb>CRC:\u003c/b> قسمة كثيرات حدود بترديد 2 على مولّد معروف، والباقي يُلحق بالرسالة، وهي فعالة لأخطاء الرزم (burst).\u003c/li>\u003c/ul>`,example:\"بيانات 0110 بتماثل زوجي: فيها واحدان فـ P = 0، وبتماثل فردي P = 1. ومثال checksum: 1100 + 0000 + 1010 = 10110 وآخر 4 بتات 0110.\",quiz:{q:\"ما بت التماثل الزوجي للبيانات 1011؟\",opts:[\"0\",\"1\"],a:1,why:\"فيها ثلاث واحدات (فردي) فنضيف 1 ليصبح العدد 4 زوجيًا.\"}},\n{title:\"6. الترميز الأبجدي الرقمي\",body:`\u003cp>يمثل الحروف والأرقام والرموز. أشهره \u003cb>ASCII\u003c/b> بـ 7 بتات (128 رمزًا): الرموز 0–31 للتحكم، و48–57 للأرقام 0–9، و65–90 للحروف الكبيرة، و97–122 للحروف الصغيرة، والفرق بين الصغير والكبير 32. وهناك EBCDIC وUnicode لتمثيل لغات متعددة.\u003c/p>`,example:\"الحرف A = 65 = 1000001 = 0x41، والحرف a = 97 = 0x61.\",quiz:{q:\"ما رمز ASCII للحرف الصغير b؟\",opts:[\"66\",\"98\",\"97\",\"32\"],a:1,why:\"a = 97 فيكون b = 98 (أو B = 66 زائد 32).\"}}\n]},\n{title:\"جبر بول\", lessons:[\n{title:\"1. مدخل إلى جبر بول\",body:`\u003cp>جبر بول فرع رياضي يدرس العمليات والدوال على المتغيرات المنطقية، ابتكره George Boole. المتغير المنطقي يأخذ قيمتين فقط (0 و1، أو صح وخطأ)، ويستعمل لدراسة الأنظمة ثنائية الحالة (مفتاح مفتوح/مغلق، مستوى جهد عالٍ/منخفض).\u003c/p>\u003cp>العمليات الأساسية: \u003cb>AND\u003c/b> (·، ∧)، \u003cb>OR\u003c/b> (+، ∨)، \u003cb>NOT\u003c/b> (¬، الشرطة العلوية). وتنفذها دارات إلكترونية تسمى البوابات المنطقية.\u003c/p>`,example:\"A·B = 1 فقط إذا كان A = 1 وB = 1. وA + B = 0 فقط إذا كان A = 0 وB = 0.\",quiz:{q:\"كم قيمة يأخذ المتغير المنطقي؟\",opts:[\"1\",\"2\",\"10\",\"غير محدود\"],a:1,why:\"قيمتان فقط: 0 و1.\"}},\n{title:\"2. الدالة المنطقية وجدول الحقيقة\",body:`\u003cp>الدالة المنطقية مزج لمتغيرات ومؤثرات. وجدول الحقيقة يعدد كل تركيبات المتغيرات (2ⁿ سطرًا لـ n متغيرات) مع قيمة الدالة.\u003c/p>\u003ctable class=\"t\">\u003ctr>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>A·B\u003c/th>\u003cth>A+B\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cb>الأولوية:\u003c/b> الأقواس ثم NOT ثم AND ثم OR، فـ A+BC = A+(BC).\u003c/p>`,example:\"لثلاثة متغيرات A,B,C يحوي الجدول 2³ = 8 أسطر.\",quiz:{q:\"كم سطرًا في جدول حقيقة دالة بأربعة متغيرات؟\",opts:[\"8\",\"16\",\"4\",\"32\"],a:1,why:\"2⁴ = 16.\"}},\n{title:\"3. القوانين والمبرهنات\",body:`\u003cdiv class=\"formula\">A·B = B·A &nbsp; ; &nbsp; A+B = B+A &nbsp; (تبديل)\u003cbr>A(B+C) = AB+AC &nbsp; ; &nbsp; A+BC = (A+B)(A+C) &nbsp; (توزيع)\u003cbr>A·A = A &nbsp; ; &nbsp; A+A = A &nbsp; (توحيد)\u003cbr>A·1 = A &nbsp; ; &nbsp; A+0 = A &nbsp; ; &nbsp; A·0 = 0 &nbsp; ; &nbsp; A+1 = 1\u003cbr>A·Ā = 0 &nbsp; ; &nbsp; A+Ā = 1 &nbsp; ; &nbsp; (Ā)‾ = A\u003cbr>A + AB = A &nbsp; ; &nbsp; A(A+B) = A &nbsp; (امتصاص)\u003cbr>A + ĀB = A + B &nbsp; (تبسيط)\u003c/div>\u003cp>ويمكن إثبات أي قانون بجدول الحقيقة.\u003c/p>`,example:\"A·B + A·B̄ = A(B + B̄) = A·1 = A.\",quiz:{q:\"ما ناتج A + A·B؟\",opts:[\"A·B\",\"A\",\"B\",\"1\"],a:1,why:\"قانون الامتصاص: A + AB = A(1+B) = A.\"}},\n{title:\"4. قوانين دي مورغان\",body:`\u003cdiv class=\"formula\">(A·B)‾ = Ā + B̄\u003cbr>(A + B)‾ = Ā · B̄\u003c/div>\u003cp>تتيح تحويل AND إلى OR وبالعكس مع عكس الدخل والخرج، وتعمم على أي عدد من المتغيرات: متمم الجداء = مجموع المتممات، ومتمم المجموع = جداء المتممات.\u003c/p>`,example:\"(Ā + B)‾ = A · B̄. وللتحقق: عند A=1 وB=0 يكون Ā+B = 0 فمتممه 1، وA·B̄ = 1.\",quiz:{q:\"ما (A + B)‾؟\",opts:[\"Ā + B̄\",\"Ā · B̄\",\"A · B\",\"Ā · B\"],a:1,why:\"متمم المجموع يساوي جداء المتممات.\"}},\n{title:\"5. المؤثرات الأخرى: XOR وNAND وNOR\",body:`\u003ctable class=\"t\">\u003ctr>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>XOR\u003c/th>\u003cth>NAND\u003c/th>\u003cth>NOR\u003c/th>\u003cth>XNOR\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/table>\u003cdiv class=\"formula\">A ⊕ B = ĀB + AB̄ &nbsp;;&nbsp; A⊕A = 0 &nbsp;;&nbsp; A⊕0 = A &nbsp;;&nbsp; A⊕1 = Ā\u003c/div>\u003cp>XOR يعطي 1 إذا اختلف الدخلان، وXNOR هو التكافؤ. وبوابتا NAND وNOR \u003cb>شاملتان\u003c/b>: تُبنى بهما كل الدوال.\u003c/p>`,example:\"A ⊕ B عند A=1 وB=1 يساوي 0 لأن الدخلين متساويان.\",quiz:{q:\"متى تعطي بوابة NAND الخرج 0؟\",opts:[\"إذا كان أحد الدخلين 0\",\"إذا كان الدخلان 1\",\"دائمًا\",\"أبدًا\"],a:1,why:\"NAND هي متمم AND، فتساوي 0 فقط عند A=B=1.\"}},\n{title:\"6. تمثيل الدالة المنطقية\",body:`\u003cp>يمكن تمثيل الدالة بعدة طرق: \u003cb>جدول الحقيقة\u003c/b>، \u003cb>مخططات Venn\u003c/b>، \u003cb>جدول كارنو\u003c/b> (K-map)، \u003cb>المخطط المنطقي\u003c/b> (رسم البوابات)، و\u003cb>العبارة الجبرية\u003c/b>. تقييم الدالة بتعويض قيم المتغيرات.\u003c/p>`,example:\"F(A,B,C) = ĀB + AC. عند A=0 وB=1 وC=1: ĀB = 1 فالدالة تساوي 1.\",quiz:{q:\"ما قيمة F = ĀB + AC عند A=1 وB=1 وC=0؟\",opts:[\"0\",\"1\"],a:0,why:\"ĀB = 0 وAC = 0، فالمجموع 0.\"}},\n{title:\"7. الصيغ القانونية\",body:`\u003cp>\u003cb>حد الجداء (minterm)\u003c/b> يحوي كل المتغيرات (أو متمماتها) في جداء، و\u003cb>حد المجموع (maxterm)\u003c/b> في مجموع.\u003c/p>\u003cul>\u003cli>\u003cb>الصيغة القانونية الأولى (SOP):\u003c/b> مجموع حدود الجداء، نأخذ أسطر الجدول التي فيها F = 1.\u003c/li>\u003cli>\u003cb>الصيغة القانونية الثانية (POS):\u003c/b> جداء حدود المجموع، نأخذ الأسطر التي فيها F = 0 مع عكس المتغيرات.\u003c/li>\u003c/ul>`,example:\"إذا F = 1 عند الأسطر 1 و3 و7 لثلاثة متغيرات: F = Σm(1,3,7) = ĀB̄C + ĀBC + ABC. وبالتبسيط F = ĀC + BC.\",quiz:{q:\"في الصيغة القانونية الأولى نأخذ الأسطر التي فيها:\",opts:[\"F = 0\",\"F = 1\",\"كل الأسطر\",\"A = 1\"],a:1,why:\"مجموع الجداءات يُبنى من أسطر F=1.\"}},\n{title:\"8. التبسيط بخرائط كارنو وQMC\",body:`\u003cp>ترتب الأسطر والأعمدة بترتيب Gray حتى يختلف كل خليتين متجاورتين ببت واحد. نجمّع الخانات التي قيمتها 1 في مجموعات \u003cb>أحجامها قوى 2\u003c/b> (1، 2، 4، 8) وأكبر ما يمكن، ويمكن اللف حول الحواف. كل مجموعة تعطي حدًا يحوي المتغيرات الثابتة فقط.\u003c/p>\u003ctable class=\"t\">\u003ctr>\u003cth>A \\\\ BC\u003c/th>\u003cth>00\u003c/th>\u003cth>01\u003c/th>\u003cth>11\u003c/th>\u003cth>10\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/table>\u003cp>المجموعة {m1,m3} تعطي ĀC، والمجموعة {m3,m7} تعطي BC، فـ F = ĀC + BC. أما \u003cb>طريقة Quine–McCluskey\u003c/b> فجدولية ومناسبة لعدد كبير من المتغيرات.\u003c/p>`,example:\"الخلايا m1 وm3 وm7 تساوي 1 في الجدول أعلاه، والتجميع يعطي F = ĀC + BC.\",quiz:{q:\"أي أحجام المجموعات مسموح بها في خريطة كارنو؟\",opts:[\"3\",\"5\",\"4\",\"6\"],a:2,why:\"يجب أن يكون الحجم قوة للعدد 2: 1، 2، 4، 8.\"}}\n]}\n];\nlet chapter=0, lesson=0;\nconst done = new Set(JSON.parse(localStorage.getItem(\"arch_lab_done\")||\"[]\"));\nconst list=document.getElementById(\"lessonList\"), content=document.getElementById(\"content\");\nfunction cvt(){\n const n=document.getElementById(\"cvn\"); if(!n) return;\n const f=+document.getElementById(\"cvf\").value, g=+document.getElementById(\"cvg\").value, s=n.value.trim().toUpperCase();\n const o=document.getElementById(\"cvo\");\n if(!s||![...s].every(c=>\"0123456789ABCDEF\".indexOf(c)>=0&&\"0123456789ABCDEF\".indexOf(c)\u003cf)){o.textContent=\"أدخل عددًا صالحًا في الأساس \"+f;return}\n let v=0; for(const c of s) v=v*f+\"0123456789ABCDEF\".indexOf(c);\n o.textContent=\"(\"+s+\")\"+f+\" = (\"+v.toString(g).toUpperCase()+\")\"+g;\n}\nfunction updateProgress(){\n const total=chapters.reduce((n,c)=>n+c.lessons.length,0);\n document.getElementById(\"progressText\").textContent=done.size+\" من \"+total+\" دروس\";\n document.getElementById(\"progressBar\").style.width=(done.size/total*100)+\"%\";\n}\nfunction render(){\n const c=chapters[chapter], l=c.lessons[lesson];\n document.getElementById(\"sideTitle\").textContent=\"الفصل \"+(chapter+1)+\": \"+c.title;\n list.innerHTML=\"\";\n c.lessons.forEach((x,i)=>{const b=document.createElement(\"button\");b.textContent=(done.has(chapter+\"-\"+i)?\"✓ \":\"\")+x.title;b.className=i===lesson?\"active\":\"\";b.onclick=()=>{lesson=i;render()};list.appendChild(b)});\n content.innerHTML=`\u003cspan class=\"tag\">الفصل ${chapter+1} · الدرس ${lesson+1}\u003c/span>\u003ch2 style=\"margin-top:10px\">${l.title}\u003c/h2>${l.body}\u003cdiv class=\"card\">\u003ch3>مثال توضيحي\u003c/h3>\u003cp>${l.example}\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>اختبر فهمك\u003c/h3>\u003cp>\u003cb>${l.quiz.q}\u003c/b>\u003c/p>\u003cdiv id=\"opts\">\u003c/div>\u003cdiv id=\"feedback\">\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"mark\">تمت مراجعة الدرس ✓\u003c/button>\u003cbutton id=\"prev\">الدرس السابق\u003c/button>\u003cbutton id=\"next\">الدرس التالي\u003c/button>\u003c/div>`;\n l.quiz.opts.forEach((o,i)=>{const b=document.createElement(\"button\");b.className=\"option\";b.textContent=(i+1)+\". \"+o;b.onclick=()=>{const f=document.getElementById(\"feedback\");f.className=\"feedback \"+(i===l.quiz.a?\"good\":\"bad\");f.textContent=(i===l.quiz.a?\"إجابة صحيحة! \":\"ليست الإجابة الصحيحة. \")+l.quiz.why};document.getElementById(\"opts\").appendChild(b)});\n document.getElementById(\"mark\").onclick=()=>{done.add(chapter+\"-\"+lesson);localStorage.setItem(\"arch_lab_done\",JSON.stringify([...done]));render();updateProgress()};\n document.getElementById(\"prev\").onclick=()=>{if(lesson>0){lesson--;render()}else if(chapter>0){chapter--;lesson=chapters[chapter].lessons.length-1;setChapterButtons();render()}};\n document.getElementById(\"next\").onclick=()=>{if(lesson\u003cc.lessons.length-1){lesson++;render()}else if(chapter\u003cchapters.length-1){chapter++;lesson=0;setChapterButtons();render()}};\n cvt();updateProgress();\n}\nfunction setChapterButtons(){document.querySelectorAll(\"[data-ch]\").forEach(b=>b.classList.toggle(\"active\",Number(b.dataset.ch)===chapter))}\ndocument.querySelectorAll(\"[data-ch]\").forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.ch);lesson=0;setChapterButtons();render()});\nrender();updateProgress();\n\u003c/script>\u003c/body>\u003c/html>\n"}]</script>
<script>
(function(){
var labs=JSON.parse(document.getElementById('labdata').textContent);
var tabs=document.getElementById('tabs'),main=document.getElementById('main'),sub=document.getElementById('sub');
var frames={},btns=[],cur=0;
var mode=null,mb=document.getElementById('mode');
try{mode=localStorage.getItem('labs_mode')}catch(e){}
if(mode!=='dark'&&mode!=='light')mode=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
function applyTo(f){try{f.contentDocument.documentElement.setAttribute('data-theme',mode)}catch(e){}}
function setMode(m){
  mode=m;try{localStorage.setItem('labs_mode',m)}catch(e){}
  document.documentElement.setAttribute('data-theme',m);
  mb.textContent=m==='dark'?'وضع صباحي':'وضع ليلي';
  mb.setAttribute('aria-label',m==='dark'?'التبديل إلى الوضع الصباحي':'التبديل إلى الوضع الليلي');
  Object.keys(frames).forEach(function(k){applyTo(frames[k])});
}
mb.onclick=function(){setMode(mode==='dark'?'light':'dark')};
setMode(mode);
try{var s=parseInt(localStorage.getItem('labs_cur'),10);if(s>=0&&s<labs.length)cur=s}catch(e){}
function show(i){
  cur=i;try{localStorage.setItem('labs_cur',String(i))}catch(e){}
  labs.forEach(function(l,k){
    btns[k].setAttribute('aria-selected',k===i?'true':'false');
    if(frames[k])frames[k].hidden=(k!==i);
  });
  if(!frames[i]){
    var f=document.createElement('iframe');
    f.title=labs[i].name;f.addEventListener('load',function(){applyTo(f)});
    f.srcdoc=labs[i].html;main.appendChild(f);frames[i]=f;
  }
  sub.textContent=labs[i].note;
  document.title='مختبرات السنة';
}
labs.forEach(function(l,i){
  var b=document.createElement('button');
  b.type='button';b.setAttribute('role','tab');b.textContent=l.name;
  b.onclick=function(){show(i)};
  tabs.appendChild(b);btns.push(b);
});
show(cur);
})();
</script>

</body></html>
