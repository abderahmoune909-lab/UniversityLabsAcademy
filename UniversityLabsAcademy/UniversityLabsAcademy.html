إدارة الموارد: تخصيص وتقاسم وحماية الذاكرة والمعالجات والبرامج والاتصالات.\u003cbr>\u003cb>المهام الأربع:\u003c/b> تسيير الأنشطة المتزامنة، والمعلومات، والاتصالات، وحماية المعطيات والمستخدمين.'],\n['الواجهات والمكونات','API تتيح للبرامج التفاعل مع النظام عبر \u003cb>استدعاءات النظام\u003c/b> (System Calls)، أما واجهة المستخدم فرسومية GUI أو سطر أوامر CLI.\u003cdiv class=mt>المكونات الأربعة: إدارة العمليات · إدارة الذاكرة · إدارة الملفات · إدارة الإدخال/الإخراج\u003c/div>النواة (Kernel) تنفذ الوظائف الأساسية ذات الامتياز، والصدفة (Shell) مفسر أوامر وليست النواة. مثال: printf دالة مكتبة قد تستدعي write (نداء نظام)، وليس كل أمر في الطرفية نداء نظام.'],\n['ثلاث وجهات نظر ومفاهيم','النظام: (أ) واجهة لتطوير وتشغيل التطبيقات (عمليات، ذاكرة، ملفات، إدخال/إخراج)، (ب) نظام تحكم وإدارة موارد، (ج) برنامج بهياكل بيانات وخوارزميات.\u003cdiv class=mt>الافتراضية: تصور مبسط للموارد · التزامن: أنشطة متعددة تتقاسم الموارد · الاستمرارية: بقاء البيانات بعد انتهاء البرنامج\u003c/div>'],\n['التاريخ والأداء','تطور الأنظمة: الدفعات (Batch) ← تعدد البرمجة (Multiprogramming) ← تقاسم الزمن (Time-sharing) ← الحواسيب الشخصية.\u003cdiv class=mt>زمن الاستجابة (Response) · الإنتاجية (Throughput = أعمال/ثانية) · الاستغلال (Utilization = وقت الاشتغال/الزمن الكلي)\u003c/div>التزامن (Concurrency) تداخل التنفيذ ولو بمعالج واحد، والتوازي (Parallelism) تنفيذ فعلي متزامن على أكثر من معالج. في الوسائط المتعددة تُضاف قيود زمنية: فقدان إطارات الفيديو يعني خللاً في الجدولة.'],\n[V,'\u003cb>Operating System\u003c/b> — نظام التشغيل\u003cbr>\u003cb>Kernel\u003c/b> — النواة\u003cbr>\u003cb>Shell\u003c/b> — الصدفة\u003cbr>\u003cb>System call\u003c/b> — نداء نظام\u003cbr>\u003cb>Virtual machine\u003c/b> — آلة افتراضية\u003cbr>\u003cb>Process\u003c/b> — عملية\u003cbr>\u003cb>Multiprogramming\u003c/b> — تعدد البرمجة\u003cbr>\u003cb>Time-sharing\u003c/b> — تقاسم الزمن\u003cbr>\u003cb>Throughput\u003c/b> — الإنتاجية\u003cbr>\u003cb>Concurrency\u003c/b> — التزامن\u003cbr>\u003cb>Parallelism\u003c/b> — التوازي\u003cbr>\u003cb>Batch\u003c/b> — دفعات']],\nq:[['عدد وظائف نظام التشغيل الكبرى:',['ثلاث','اثنتان','أربع'],0,'سهولة الاستعمال، استقلالية عن العتاد، الكفاءة.'],\n['لماذا يسمى نظام التشغيل آلة افتراضية؟',['لأنه يخفي تفاصيل العتاد ويقدم واجهة مجردة','لأنه يعمل على الإنترنت','لأنه لا يحتاج عتاداً'],0,'التجريد يخفي العتاد وتقاسم الموارد.'],\n['printf في لغة C:',['نداء نظام','دالة مكتبة','جزء من النواة'],1,'دالة مكتبة قد تستدعي write داخلياً.'],\n['إنتاجية 240 عملاً في 60 ثانية:',['4 أعمال/ث','40 عملاً/ث','0.25 عمل/ث'],0,'240÷60=4.']],\ne:['اشرح نظام التشغيل من ثلاث وجهات نظر',['واجهة تطبيقات: يقدم خدمات فتح الملفات والذاكرة والإدخال/الإخراج ويخفي العتاد.','مدير موارد: يقسّم زمن المعالج والذاكرة والأجهزة ويوازن بين الكفاءة والحماية.','برنامج: له هياكل بيانات (جداول عمليات) وخوارزميات (جدولة) لتنفيذ الخدمات. ∎']],\nx:[['ميّز بين النواة والصدفة والبرنامج والعملية والمكتبة ونداء النظام',['النواة تنفذ الخدمات الأساسية ذات الامتياز؛ الصدفة مفسر أوامر؛ البرنامج ملف قابل للتنفيذ؛ العملية برنامج قيد التنفيذ.','المكتبة دوال جاهزة؛ ونداء النظام بوابة إلى النواة.','الأمر في الطرفية قد يشغّل برنامجاً يستدعي عدة نداءات، فليس نداء نظام واحداً. ∎']],\n['تطبيقان يتناوبان على معالج واحد: تزامن أم توازٍ؟',['متزامنان لكنهما لا يُنفذان فعلياً في اللحظة نفسها على معالج واحد.','التوازي يحتاج أكثر من وحدة تنفيذ تعمل معاً.','التبديل السريع يحقق تقدماً لكليهما دون توازٍ حقيقي. ∎']],\n['240 عملاً في 60 ث ومعالج مشغول 42 ث من 60: احسب الإنتاجية والاستغلال',['الإنتاجية 240÷60=4 أعمال/ث.','الاستغلال 42÷60×100=70%.','لا يكشف هذان المتوسطان زمن الاستجابة لطلب معين، فقد تتأخر بعض الطلبات. ∎']],\n['لماذا ظهر تعدد البرمجة وتقاسم الزمن؟ وما قيد الوسائط المتعددة؟',['تعدد البرمجة: عند انتظار عمل للإدخال/الإخراج يعمل آخر فيزداد استغلال المعالج.','تقاسم الزمن: يوزع الزمن بين المستخدمين فيدعم التفاعل.','الفيديو يحتاج مواعيد دقيقة: فقدان الإطارات يدل على خلل في الجدولة أو الإدخال/الإخراج. ∎']]],\nh:['كيف أجيب عن أسئلة التعريف؟','ابدأ بالتعريف في جملة، ثم اذكر الوظائف الثلاث، ثم مثالاً. تذكر: النواة ≠ الصدفة.']},\n\n{t:'Chapter 2 — UNIX والصدفة وفتح الجلسة',n:'UNIX',\ns:[['تاريخ UNIX','\u003cdiv class=\"mt c\">1969 Thompson &amp; Ritchie: UNIX (Bell Labs)\u003cbr>1973 إعادة كتابته بلغة C: قابلية النقل\u003cbr>1974 BSD (بيركلي)\u003cbr>1991 Linus Torvalds: Linux 0.0.1 (GPL)\u003cbr>1995 توزيعات Debian, RedHat\u003c/div>'],\n['متعدد المستخدمين ومتعدد المهام','\u003cb>متعدد المستخدمين:\u003c/b> تُقسَّم الموارد بالزمن مع آليات تعريف وحماية. \u003cb>متعدد المهام:\u003c/b> مستخدم واحد يشغّل عدة مهام. العملية = تنفيذ برنامج في لحظة معينة. نظام الملفات هرمي، والأجهزة تُعامل كملفات، و99% من UNIX مكتوب بلغة C.'],\n['المستخدمون والوظائف','root (المشرف): كل الصلاحيات، ينشئ المستخدمين ويوقف النظام. المستخدم العادي: ملفاته وعملياته فقط. وظائف النظام: توزيع عادل للموارد، واجهة العتاد (لا عملية تصل للعتاد مباشرة)، إدارة الذاكرة (ذاكرة افتراضية على القرص عند الامتلاء)، إدارة الملفات.'],\n['البنية الطبقية والصدفة','\u003cdiv class=\"mt c\">Users\u003cbr>Utilities (Shell, Editors, Compilers)\u003cbr>UNIX System Calls\u003cbr>Kernel (Process, Memory, I/O, File)\u003cbr>Hardware\u003c/div>الصدفة (Shell) تنتظر أوامر المستخدم وتفسرها وتنفذها: Bourne وC-Shell وBash وKorn.'],\n['فتح وإغلاق الجلسة','login ثم password (لا تظهر الكلمة). النجاح: يظهر المحث $. كلمات السر مشفرة ولا يستردها حتى root؛ ينشئ المشرف واحدة جديدة. أوامر: passwd تغيير الكلمة، useradd إنشاء حساب (للمشرف). الخروج: Ctrl-D (EOF) أو logout أو exit.'],\n[V,'\u003cb>Multi-user\u003c/b> — متعدد المستخدمين\u003cbr>\u003cb>Multitasking\u003c/b> — متعدد المهام\u003cbr>\u003cb>Time-sharing\u003c/b> — تقاسم الزمن\u003cbr>\u003cb>Superuser (root)\u003c/b> — المشرف\u003cbr>\u003cb>Shell\u003c/b> — الصدفة\u003cbr>\u003cb>Kernel\u003c/b> — النواة\u003cbr>\u003cb>Prompt\u003c/b> — المحث\u003cbr>\u003cb>Portability\u003c/b> — قابلية النقل\u003cbr>\u003cb>Login\u003c/b> — فتح الجلسة']],\nq:[['سبب كتابة UNIX بلغة C:',['قابلية النقل','سرعة الإنترنت','حجم الشاشة'],0,'إعادة كتابته بـ C سنة 1973 سهّلت نقله بين الأجهزة.'],\n['هل يمكن لـ root استرجاع كلمة سر منسية؟',['نعم','لا لأنها مشفرة','فقط في Linux'],1,'تُحذف وتُنشأ كلمة جديدة.'],\n['وظيفة الصدفة:',['إدارة الذاكرة','تفسير أوامر المستخدم وتنفيذها','تشفير الأقراص'],1,'تنتظر الأوامر وتفسرها.'],\n['للخروج من الجلسة:',['Ctrl-D','حذف الحساب','Ctrl-C فقط'],0,'Ctrl-D يرسل EOF، أو logout/exit.']],\ne:['ما الفرق بين متعدد المستخدمين ومتعدد المهام؟',['متعدد المستخدمين: عدة مستخدمين يتقاسمون الموارد زمنياً مع حماية بينهم.','متعدد المهام: مستخدم واحد يشغّل عدة عمليات معاً.','الأول يخص من يستعمل، والثاني يخص ما يُنفَّذ. ∎']],\nx:[['ما الفرق بين root والمستخدم العادي؟ وما أوامر الخروج؟',['root يتجاوز الصلاحيات: ينشئ المستخدمين، يهيئ الأقراص، يوقف النظام، يصل لكل الملفات.','العادي: ملفاته وعملياته فقط.','الخروج: Ctrl-D ثم logout ثم exit. ∎']],\n['ارسم البنية الطبقية لـ UNIX واذكر أنواع الصدفة',['من الأعلى: Users ← Utilities ← System Calls ← Kernel ← Hardware.','الصدفة ضمن الأدوات (Utilities).','Bourne وC-Shell وBash وKorn. ∎']]],\nh:['ما الذي يُحفظ؟','التواريخ 1969/1973/1991، الفرق بين المستخدمين والمهام، البنية الطبقية.']},\n\n{t:'Chapter 3 — نظام ملفات UNIX والـ inode',n:'الملفات',w:'term',\ns:[['شجرة الملفات والمراجع','الجذر / عقدة بلا اسم. أدلة شهيرة: bin (الأوامر)، etc (التحكم مثل /etc/passwd)، dev (الأجهزة)، man. ملفان في الدليل نفسه لا يتشاركان الاسم.\u003cdiv class=mt>مطلق: يبدأ بـ / (مثل /bin/date) · نسبي: من دليل العمل · . الحالي · .. الأب (وأب الجذر هو الجذر)\u003c/div>لكل مستخدم دليل Home يكون دليل العمل عند الدخول.'],\n['أوامر التنقل والعرض','\u003cdiv class=\"mt c\">pwd   # المسار المطلق\u003cbr>cd dir  |  cd (Home)\u003cbr>cat f | more f | less f\u003cbr>ls -a -l -s -i\u003c/div>cat يمر بسرعة، more صفحة صفحة (f للأمام، b للخلف، /pattern بحث، q خروج)، less أقوى. ls يخفي الملفات التي تبدأ بنقطة؛ -a كلها، -l تفاصيل، -i أرقام inode.'],\n['الأمر cp وخياراته','\u003cdiv class=\"mt c\">cp f1 f2\u003cbr>cp f1 f2 dir/\u003cbr>cp -r src dst\u003c/div>-r إلزامي للأدلة، -i يسأل قبل الكتابة، -v يعرض، -n لا يكتب فوق الموجود، -u ينسخ الأحدث فقط، -p يحافظ على الخصائص.'],\n['الـ inode','هيكل بيانات يخزن بيانات وصفية: الحجم، عناوين الكتل، المالك والصلاحيات، النوع، عدد الروابط، التواريخ. \u003cb>لا يحوي اسم الملف ولا المحتوى.\u003c/b> الدليل نفسه ملف أزواج (اسم، رقم inode). كل زوج رابط (link)، وعند وصول عدد الروابط 0 تُحرَّر المساحة. الجذر رقمه 2. نفاد الـ inodes يمنع إنشاء ملفات ولو بقيت مساحة.\u003cdiv class=\"mt c\">ls -i · stat file · df -i\u003c/div>'],\n['cp مقابل ln والروابط','\u003cdiv class=mt>cp: inode جديد ومحتوى منسوخ (ملفان مستقلان)\u003cbr>ln: اسم إضافي لنفس inode ويزداد عدد الروابط\u003c/div>rm يحذف \u003cb>رابطاً\u003c/b> لا البيانات. الرابط الرمزي ln -s: له inode خاص ومسار نصي، ويتعطل (dangling) إذا حُذف الأصل، ويعمل عبر أنظمة ملفات مختلفة، أما الصلب فلا. تنبيه: عبارة «ln ينشئ نسخة فيزيائية» في الشريحة 60 خطأ.'],\n['أوامر الإدارة','mv إعادة تسمية/نقل · mkdir · rm (rm -r لدليل، rm -i يؤكد) · rmdir (الأدلة الفارغة فقط).'],\n[V,'\u003cb>File system\u003c/b> — نظام الملفات\u003cbr>\u003cb>Directory\u003c/b> — دليل\u003cbr>\u003cb>Absolute path\u003c/b> — مسار مطلق\u003cbr>\u003cb>Relative path\u003c/b> — مسار نسبي\u003cbr>\u003cb>Inode\u003c/b> — عقدة فهرسة\u003cbr>\u003cb>Hard link\u003c/b> — رابط صلب\u003cbr>\u003cb>Symbolic link\u003c/b> — رابط رمزي\u003cbr>\u003cb>Link count\u003c/b> — عدد الروابط\u003cbr>\u003cb>Working directory\u003c/b> — دليل العمل\u003cbr>\u003cb>Home\u003c/b> — الدليل الخاص']],\nq:[['الـ inode لا يحوي:',['الحجم','اسم الملف','المالك'],1,'الأسماء في الدليل.'],\n['بعد ln a b ثم rm a:',['تُحذف البيانات','يبقى الملف عبر b وعدد الروابط 1','يتعطل b'],1,'rm يحذف رابطاً فقط.'],\n['rmdir يحذف:',['أي دليل','الدليل الفارغ فقط','الملفات'],1,'استعمل rm -r لغير الفارغ.'],\n['أب الجذر / هو:',['لا شيء','الجذر نفسه','/etc'],1,'.. في الجذر يعيد الجذر.'],\n['تعذر إنشاء ملف رغم وجود مساحة سببه:',['نفاد inodes','تعطل الشاشة','كلمة السر'],0,'df -i يكشف ذلك.']],\ne:['تمرين inode: أنشئ ثلاثة ملفات واعرض أرقامها وأضف hello إلى f1',['mkdir fs_lab &amp;&amp; cd fs_lab ثم touch f1.txt f2.txt f3.txt ثم ls -li','echo \"hello\" &gt;&gt; f1.txt ثم stat f1.txt','لكل ملف inode مختلف؛ الحجم 6 بايت؛ Links=1؛ تعديل المحتوى يغيّر mtime وctime. ∎']],\nx:[['الروابط الصلبة: echo \"some content\" &gt; data.txt ثم ln data.txt copy1.txt ثم rm data.txt ثم cat copy1.txt',['ls -li يُظهر inode واحداً للاسمين وعدد الروابط 2 لكليهما.','rm data.txt يحذف رابطاً فيعود العدد إلى 1.','cat copy1.txt يعرض المحتوى. القاعدة: rm = حذف رابط. ∎']],\n['الروابط الرمزية: ln -s original.txt symlink.txt ثم rm original.txt ثم cat symlink.txt',['للرمزي inode مختلف ونوعه l ويظهر symlink.txt -&gt; original.txt.','بعد حذف الأصل: cat: symlink.txt: No such file or directory.','الصلب يشير إلى inode والرمزي إلى مسار. ∎']],\n['استهلاك inodes: المجموع 1,000,000 والمستعمل 900,000',['المتبقي 100,000 inode.','يمكن إنشاء 100,000 ملف حتى لو حجمها 0.','عند النفاد: No space left on device رغم المساحة؛ df -i للتحقق. ∎']],\n['تمرين cp: انسخ main.c وutil.c إلى src وانسخ project احتياطياً',['mkdir src ثم cp main.c util.c src/','cp -r project project_backup (الخيار r- إلزامي).','cp -i يسأل قبل الكتابة، وcp -ru ينسخ الأحدث فقط. ∎']],\n['أنشئ practice/notes/os.txt ونسخة احتياطية ثم أعد تسميتها',[`mkdir -p practice/notes practice/backup`,`printf \"Kernel\\\\nShell\\\\n\" &gt; practice/notes/os.txt`,`cp -i practice/notes/os.txt practice/backup/ ثم mv -i practice/backup/os.txt practice/backup/os-copy.txt ثم cat practice/backup/os-copy.txt ∎`]]],\nh:['كيف أميز cp عن ln؟','اسأل: هل يوجد inode جديد؟ cp نعم (محتوى جديد)، ln لا (اسم إضافي).']},\n\n{t:'Chapter 4 — الصلاحيات والتحويل والأنابيب',n:'الصلاحيات',w:'perm',\ns:[['حقوق الوصول','ثلاث فئات: المالك u، المجموعة g، الآخرون o. للملف: r قراءة، w تعديل، x تنفيذ. للدليل: r سرد، w إنشاء/حذف داخله، x الوصول للمحتويات. root يتجاوز الكل.\u003cdiv class=\"mt c\">chmod u+x file\u003cbr>chmod 755 file   # rwxr-xr-x\u003cbr>r=4 w=2 x=1 : 751 = rwx r-x --x\u003c/div>'],\n['التحويل والأنابيب','لكل عملية stdin وstdout وstderr.\u003cdiv class=\"mt c\">cmd &lt; file   # الدخل\u003cbr>cmd &gt; file   # الخرج (يمسح)\u003cbr>cmd &gt;&gt; file  # إضافة\u003cbr>cmd 2&gt; file  # الأخطاء\u003cbr>cmd &gt; out 2&gt;&amp;1\u003cbr>c1 | c2  # أنبوب\u003c/div>الأنبوب يمرر stdout فقط لا stderr. وcat بلا وسائط يقرأ من stdin.'],\n['حالة الخروج والتسلسل','كل أمر يعيد قيمة: 0 نجاح وغير الصفر فشل، وتُقرأ بـ $?.\u003cdiv class=\"mt c\">c1 ; c2   # متتابع\u003cbr>c1 &amp;&amp; c2  # إن نجح c1\u003cbr>c1 || c2  # إن فشل c1\u003cbr>set -o pipefail\u003c/div>'],\n['الاقتباس','الاقتباس المفرد يمنع التوسيع فيطبع $name حرفياً، والمزدوج يوسّع المتغيرات: بعد name=\"OS Course\" يطبع echo \"$name\" القيمة OS Course.'],\n[V,'\u003cb>Permission\u003c/b> — صلاحية\u003cbr>\u003cb>Owner / Group / Others\u003c/b> — المالك / المجموعة / الآخرون\u003cbr>\u003cb>Redirection\u003c/b> — تحويل\u003cbr>\u003cb>Pipe\u003c/b> — أنبوب\u003cbr>\u003cb>stdin / stdout / stderr\u003c/b> — الدخل / الخرج / الأخطاء\u003cbr>\u003cb>Exit status\u003c/b> — حالة الخروج\u003cbr>\u003cb>Quoting\u003c/b> — اقتباس\u003cbr>\u003cb>chmod\u003c/b> — تغيير الصلاحيات']],\nq:[['rwxr-x--x تساوي ثمانياً:',['751','755','641'],0,'7=rwx،5=r-x،1=--x.'],\n['644 رمزياً:',['rw-r--r--','rwxr--r--','rw-rw-r--'],0,'6=rw-،4=r--،4=r--.'],\n['الفرق بين &gt; و &gt;&gt;:',['الأول يمسح والثاني يضيف','متطابقان','الأول للأخطاء'],0,'الثاني إضافة في النهاية.'],\n['الأنبوب يمرر:',['stdout','stderr فقط','الملفات'],0,'ولا يمرر stderr.'],\n['الاقتباس المفرد حول $name:',['يوسّع المتغير','يطبع $name حرفياً','يحذف النص'],1,'المزدوج هو الموسّع.']],\ne:['اجعل os.txt للمالك قراءة وكتابة وللمجموعة قراءة وبلا صلاحيات للآخرين',['القيمة الثمانية: chmod 640 practice/notes/os.txt.','الرمزي: chmod u=rw,g=r,o= practice/notes/os.txt.','النتيجة rw-r-----. ∎']],\nx:[['أنشئ out.txt من ls وأضف سطراً وسجّل خطأ ls في err.txt',[`ls practice/notes/os.txt &gt; out.txt`,`printf \"Another line\\\\n\" &gt;&gt; out.txt ثم ls nonexistent-demo 2&gt; err.txt`,`الإعادة بـ &gt; تستبدل المحتوى، والإضافة &gt;&gt; تحتفظ به. ∎`]],\n['توقع النواتج: false ثم true ثم false || true مع طباعة $? بعد كل منها',['false يعيد 1 فيطبع الأول 1.','true يعيد 0 فيطبع الثاني 0.','في false || true تُنفَّذ true لأن false فشل، فالحالة 0: النواتج 1 ثم 0 ثم 0. ∎']],\n['الفرق بين الاقتباس المفرد والمزدوج لـ $name بعد name=\"OS Course\"',['الاقتباس المفرد يطبع $name حرفياً.','المزدوج يوسّع المتغير فيطبع OS Course.','التوسيع المزدوج يبقي القيمة وسيطاً واحداً رغم المسافة. ∎']],\n['توقع ناتج: ملف sample يحوي video وaudio وvideo وimage؛ ثم wc -l &lt; sample وLC_ALL=C sort -u sample وsort | uniq -c',['wc -l يعطي 4 أسطر.','sort -u: audio ثم image ثم video.','sort | uniq -c: 1 audio، 1 image، 2 video. ∎']],\n['صح أم خطأ: (A) Bash نواة Linux (B) touch يحذف ملفاً (C) uniq يدمج كل التكرارات (D) الأنبوب يمرر stdout (E) النجاح يعيد 1 (F) للبرنامج الواحد عدة نسخ',['A خطأ: Bash صدفة. B خطأ: touch ينشئ ملفاً أو يحدث التوقيت.','C خطأ: uniq يدمج المتجاورة فقط. D صحيح: لا يمرر stderr.','E خطأ: النجاح يعيد 0. F صحيح: عدة نسخ تشغيل للبرنامج الواحد. ∎']],\n['اكتب أمراً يعدّ الكلمات المطابقة لكلمة داخل ملف، وماذا يفعل ls | wc -l',['cat file.txt | grep \"keyword\" | wc -w','ls | wc -l يعد الملفات والأدلة.','cmd &gt; out 2&gt;&amp;1 يرسل الخرج والأخطاء إلى الملف نفسه. ∎']]],\nh:['كيف أحول الصلاحيات؟','اكتب r=4 وw=2 وx=1 لكل ثلاث خانات واجمعها. rwx=7 وr-x=5 وr--=4.']},\n\n{t:'Chapter 5 — التطبيق العملي: الأوامر والسكربت وC',n:'التطبيق',\ns:[['أوامر النصوص والمساحة','\u003cdiv class=\"mt c\">head -n 2 f · tail -n 2 f · nl f\u003cbr>wc -l -w -c f\u003cbr>sort f · uniq -c · LC_ALL=C sort f\u003cbr>df -h . · du -sh .\u003cbr>whoami · id · uname -a · date · help cmd\u003c/div>uniq يدمج المتجاورة فقط لذا تسبقه sort. wc -c يعد البايتات والحرف العربي أكثر من بايت. الخيار --help يشرح الأمر.'],\n['السكربت التطبيقي','أول سطر #!/usr/bin/env bash. اختبر الوسائط بـ [[ $# -ne 1 ]]، وسجل الأخطاء إلى stderr بـ &gt;&amp;2، وأنهِ بـ exit 2 عند الخطأ.\u003cdiv class=\"mt c\">chmod u+x inspect.sh\u003cbr>./inspect.sh media.txt\u003c/div>$# عدد الوسائط و$1 الأول، و-f اختبار وجود ملف عادي. حلقة: for item in audio video image; do printf \"Type: %s\\\\n\" \"$item\"; done'],\n['العمليات الخلفية','sleep 60 &amp; يبدأ مهمة بالخلفية، و$! معرف آخر مهمة خلفية فاحفظه فوراً: demo_pid=$! ثم jobs وkill \"$demo_pid\". وwait ينتظر الانتهاء.'],\n['مدخل إلى C وخدمات النظام','\u003cdiv class=\"mt c\">cc hello.c -o hello\u003cbr>./hello\u003cbr>printf \"%s\\\\n\" \"$?\"\u003c/div>cc يحول الملف المصدري hello.c إلى الملف التنفيذي hello. و$? يعرض حالة الخروج (return 0 نجاح). printf دالة مكتبة وليست نداء نظام؛ تستدعي write داخلياً.'],\n[V,'\u003cb>Script\u003c/b> — سكربت\u003cbr>\u003cb>Argument\u003c/b> — وسيط\u003cbr>\u003cb>Background job\u003c/b> — مهمة خلفية\u003cbr>\u003cb>PID\u003c/b> — معرف العملية\u003cbr>\u003cb>Compiler\u003c/b> — مترجم\u003cbr>\u003cb>Source file\u003c/b> — ملف مصدري\u003cbr>\u003cb>Executable\u003c/b> — ملف تنفيذي\u003cbr>\u003cb>Exit status\u003c/b> — حالة الخروج\u003cbr>\u003cb>Pipeline\u003c/b> — خط أنابيب']],\nq:[['السطر الأول في السكربت:',['#!/usr/bin/env bash','#include','//bash'],0,'يحدد المفسر.'],\n['$! تمثل:',['معرف آخر مهمة خلفية','حالة الخروج','عدد الوسائط'],0,'احفظها فوراً.'],\n['$? بعد برنامج ناجح:',['0','1','-1'],0,'الصفر نجاح.'],\n['sort قبل uniq لأن uniq:',['يدمج المتجاورة فقط','يرتب','يحذف الملف'],0,'التكرارات غير المتجاورة لا تُدمج.']],\ne:['اكتب سكربتاً يقبل وسيطاً واحداً هو دليل ويعرض حجمه',[`if [[ $# -ne 1 ]]; then printf \"Usage: %s DIRECTORY\\\\n\" \"$0\" &gt;&amp;2; exit 2; fi`,`if [[ ! -d \"$1\" ]]; then printf \"Invalid directory: %s\\\\n\" \"$1\" &gt;&amp;2; exit 1; fi`,`du -sh -- \"$1\" ∎`]],\nx:[['ابدأ sleep 60 بالخلفية واعرض معرفها وأوقفها',[`sleep 60 &amp;`,`demo_pid=$! ثم jobs`,`kill \"$demo_pid\": $! تحفظ معرف آخر مهمة خلفية ولا تختلط بمهمة بدأت لاحقاً. ∎`]],\n['ابنِ hello.c وشغّله واشرح لماذا printf ليست نداء نظام',[`cc hello.c -o hello ينتج hello من المصدر، ثم ./hello يشغله، وprintf \"%s\\\\n\" \"$?\" تعرض حالة الخروج 0.`,`printf دالة مكتبة تهيئ المخرجات ثم تستدعي نداء النظام write، فالمستويان مختلفان.`,`الملف المصدري hello.c والتنفيذي hello والعملية تنشأ عند التشغيل. ∎`]],\n['أنتج تقرير تكرار للأنواع في labels.txt (الخرج في report.txt والأخطاء في report-errors.txt)',[`printf \"audio\\\\nvideo\\\\naudio\\\\nimage\\\\nvideo\\\\n\" &gt; labels.txt`,`set -o pipefail ثم { LC_ALL=C sort labels.txt | uniq -c; } &gt; report.txt 2&gt; report-errors.txt`,`cat report.txt يعرض: 2 audio ثم 1 image ثم 2 video. ∎`]]],\nh:['كيف أتدرب؟','نفّذ كل مثال داخل مجلد تدريب مثل ~/os-ch1-lab، واستعمل man وcmd --help.']}\n];\nlet S={m:0,d:{},x:0},p=0;\ntry{Object.assign(S,JSON.parse(localStorage.getItem('os1')||'{}'))}catch(e){}\nif(!(S.m>=0&&S.m\u003cM.length))S.m=0;\nconst save=()=>{try{localStorage.setItem('os1',JSON.stringify({m:S.m,d:S.d,x:S.x}))}catch(e){}};\nfunction go(i){S.m=i;p=0;save();draw()}\nfunction nxt(d){p+=d;draw()}\nfunction pick(b,i){let q=M[S.m].q[p-M[S.m].s.length];if(b.parentNode.dataset.l)return;b.parentNode.dataset.l=1;\n[...b.parentNode.children].forEach((e,j)=>{e.disabled=1;if(j==q[2])e.classList.add('ok')});\nif(i==q[2])S.x+=10;else b.classList.add('no');\nb.parentNode.insertAdjacentHTML('afterend',`\u003cdiv class=ex>${i==q[2]?'✅ صحيح! ':'❌ ليست الصحيحة. '}${q[3]}\u003c/div>`);$('#go').hidden=0;save();top_()}\nfunction top_(){let k=Object.keys(S.d).length;$('#xp').textContent=`⭐ ${S.x} نقطة · أنجزت ${k}/${M.length} فصول`;$('#bar i').style.width=k/M.length*100+'%'}\nfunction draw(){let m=M[S.m],n=m.s.length,L=n-2,h='';\n$('#nav').innerHTML=M.map((x,i)=>`\u003cbutton class=\"${i==S.m?'on':''} ${S.d[i]?'dn':''}\" onclick=go(${i}) title=\"${x.t}\">${i+1}. ${x.n}\u003c/button>`).join('');\nif(p\u003cn){let s=m.s[p];h=`\u003cdiv class=card>\u003cdiv class=tag>${m.t} — الدرس ${p+1} من ${n}\u003c/div>\u003ch2>${s[0]}\u003c/h2>${s[1]}${p==L&&m.w?W[m.w]:''}${p==L?`\u003cdetails>\u003csummary>${m.h[0]}\u003c/summary>${m.h[1]}\u003c/details>`:''}${p==L&&(m.e||m.x)?EX([m.e,...(m.x||[])].filter(Boolean)):''}\u003cdiv class=btns>\u003cbutton class=s onclick=nxt(-1) ${p?'':'hidden'}>السابق\u003c/button>\u003cbutton class=p onclick=nxt(1)>${p==n-1?'ابدأ الاختبار':'التالي'}\u003c/button>\u003c/div>\u003c/div>`}\nelse if(p-n\u003cm.q.length){let i=p-n,q=m.q[i];h=`\u003cdiv class=card>\u003cdiv class=tag>اختبار ${m.t} — سؤال ${i+1} من ${m.q.length}\u003c/div>\u003ch2>${q[0]}\u003c/h2>\u003cdiv>${q[1].map((o,j)=>`\u003cbutton class=o onclick=pick(this,${j})>${o}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=btns>\u003cspan>\u003c/span>\u003cbutton class=p id=go hidden onclick=nxt(1)>التالي\u003c/button>\u003c/div>\u003c/div>`}\nelse{S.d[S.m]=1;save();h=`\u003cdiv class=card>\u003ch2>🎉 أنهيت «${m.t}»\u003c/h2>\u003cp>أحسنت! ${S.m\u003cM.length-1?'الفصل التالي ينتظرك.':'أنهيت كل الفصول، ارجع لأي فصل للمراجعة.'}\u003c/p>\u003cdiv class=btns>\u003cbutton class=s onclick=go(S.m)>أعد الفصل\u003c/button>${S.m\u003cM.length-1?'\u003cbutton class=p onclick=go(S.m+1)>الفصل التالي\u003c/button>':''}\u003c/div>\u003c/div>`}\n$('#main').innerHTML=h;if(p==L&&m.w)I[m.w]();top_()}\ndraw();\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"name": "التحليل 1", "note": "الفصول 1 إلى 4", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>مختبر التحليل 1 — الفصول 1 إلى 4\u003c/title>\n\u003cstyle>\n:root{--bg:#eef3f1;--c:#fff;--t:#16232b;--m:#566872;--a:#0b6e6e;--w:#e0f2ef;--b:#cfdcd8;--ok:#15803d;--no:#b91c1c;--hl:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1a1e;--c:#17262c;--t:#e6f0ee;--m:#98adb3;--a:#3fd0c4;--w:#183a3d;--b:#2b4147;--ok:#4ade80;--no:#f87171;--hl:#3a3418;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0f1a1e;--c:#17262c;--t:#e6f0ee;--m:#98adb3;--a:#3fd0c4;--w:#183a3d;--b:#2b4147;--ok:#4ade80;--no:#f87171;--hl:#3a3418;color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--t);font:17px/1.9 \"Segoe UI\",Tahoma,\"Noto Naskh Arabic\",Arial,sans-serif}\nheader{padding:14px 16px 8px;max-width:760px;margin:auto}\nh1{margin:0;font-size:22px}\n#bar{height:8px;background:var(--b);border-radius:4px;margin:8px 0 4px;overflow:hidden}\n#bar i{display:block;height:100%;width:0;background:var(--a);transition:width .4s}\n#xp{color:var(--m);font-size:14px}\nnav{display:flex;gap:6px;flex-wrap:wrap;max-width:760px;margin:auto;padding:0 16px}\nnav button{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}\nnav button.on{background:var(--a);color:var(--bg);border-color:var(--a)}\nnav button.dn::after{content:\" ✓\"}\nmain{max-width:760px;margin:12px auto;padding:0 16px 40px}\n.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px 20px}\n.card h2{margin:0 0 6px;font-size:20px;color:var(--a)}\n.tag{font-size:13px;color:var(--m);margin-bottom:4px}\n.mt{background:var(--w);border-radius:8px;padding:6px 12px;margin:8px 0;direction:rtl}\n.btns{display:flex;gap:8px;margin-top:14px;justify-content:space-between}\nbutton.p,button.s{font:inherit;border-radius:8px;padding:6px 18px;cursor:pointer;border:1px solid var(--a)}\nbutton.p{background:var(--a);color:var(--bg)}button.s{background:none;color:var(--a)}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--a);outline-offset:2px}\n.o{display:block;width:100%;text-align:start;margin:8px 0;padding:8px 14px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;cursor:pointer}\n.o.ok{border-color:var(--ok);background:var(--w)}.o.no{border-color:var(--no)}\n.ex{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--hl)}\n.lab{background:var(--w);border-radius:10px;padding:10px 14px;margin-top:12px}\n.lab input[type=text]{width:100%;font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--b);background:var(--c);color:var(--t)}\ndetails{margin-top:12px;color:var(--m)}summary{cursor:pointer;color:var(--a)}\n.out{font-weight:600;min-height:30px;direction:ltr;text-align:right}\n@media(prefers-reduced-motion:reduce){#bar i{transition:none}}\n\n#modes{margin-bottom:8px}nav button:disabled{opacity:.45;cursor:not-allowed}\n.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.row button{border:1px solid var(--a);border-radius:8px;padding:2px 10px;font:inherit;font-size:14px;cursor:pointer;background:none;color:var(--a)}.row button.p{background:var(--a);color:var(--bg)}\n.ez{margin-top:12px;background:var(--hl);border-radius:10px;padding:6px 14px;color:var(--t)}.ez summary{font-weight:600}.ez .mist{color:var(--no);margin:2px 0 6px}\n.tb{width:100%;border-collapse:collapse;direction:ltr;font-size:15px;margin:8px 0}.tb td,.tb th{border-bottom:1px solid var(--b);padding:2px 8px;text-align:center}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>🧪 مختبر التحليل 1 — خطوة بخطوة\u003c/h1>\u003cdiv id=\"bar\">\u003ci>\u003c/i>\u003c/div>\u003cdiv id=\"xp\">\u003c/div>\u003c/header>\n\u003cnav id=\"modes\" aria-label=\"الأوضاع\">\u003c/nav>\u003cnav id=\"nav\" aria-label=\"الفصول\">\u003c/nav>\u003cmain id=\"main\">\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),gcd=(a,b)=>b?gcd(b,a%b):a;\nconst W={dec:`\u003cdiv class=lab>\u003cb>جرّب:\u003c/b> اكتب دورة عدد دوري بعد الفاصلة مباشرة (مثل 45)\u003cinput type=text id=pd inputmode=numeric oninput=dec() placeholder=\"الدورة\">\u003cdiv class=out id=po>\u003c/div>\u003c/div>`};\nfunction dec(){let p=$('#pd').value.replace(/\\D/g,'').slice(0,9);if(!p){$('#po').textContent='';return}let a=+p,b=10**p.length-1,g=gcd(a,b);$('#po').textContent=`0.(${p}) = ${p}/${b} = ${a/g}/${b/g}`}\nconst I={dec};\nlet CL=[],EI=[];\nfunction EX(L){CL=L;EI=L.map(()=>0);return `\u003ch3 style=\"color:var(--a)\">🧩 تمارين نموذجية للفروض والاختبارات (حاول على ورقة أولاً ثم اكشف)\u003c/h3>`+L.map((e,k)=>`\u003cdiv class=lab>\u003cb>تمرين ${k+1}:\u003c/b> ${e[0]}\u003cdiv id=exs${k}>\u003c/div>\u003cbutton class=s onclick=rev(${k})>اكشف الخطوة التالية\u003c/button>\u003c/div>`).join('')}\nfunction rev(k){if(EI[k]\u003cCL[k][1].length)$('#exs'+k).insertAdjacentHTML('beforeend',`\u003cdiv class=ex>الخطوة ${EI[k]+1}: ${CL[k][1][EI[k]++]}\u003c/div>`)}\nconst V='English Vocabulary / ترجمة المصطلحات';\nconst M=[\n{t:'Chapter 1 — الأعداد الناطقة والمفاهيم الأساسية',n:'الأعداد الناطقة',w:'dec',\ns:[['القاعدة الذهبية','ناطق ± ناطق، ناطق × ناطق، ناطق ÷ ناطق (غير معدوم) = \u003cb>ناطق\u003c/b> دائماً.\u003cdiv class=mt>ناطق + غير ناطق = غير ناطق\u003cbr>ناطق غير معدوم × غير ناطق = غير ناطق\u003c/div>الدليل: ننفي المطلوب (البرهان بالخلف). لو كان x+y=r ناطقاً لكان y=r−x ناطقاً: تناقض.'],\n['برهان √2 غير ناطق','نفترض √2=p/q كسراً \u003cb>مختزلاً\u003c/b>. بالتربيع p²=2q² فـ p زوجي، p=2k، فـ q²=2k² فـ q زوجي. إذن 2 قاسم مشترك: تناقض مع الاختزال.\u003cdiv class=mt>مفتاح: مربع الفردي فردي، فإذا كان p² زوجياً فـ p زوجي.\u003c/div>'],\n['الدوري إلى كسر','إذا كانت الدورة k أرقام نضرب في 10\u003csup>k\u003c/sup> ثم نطرح: x=0.(2001) ⇒ 10⁴x−x=2001 ⇒ x=2001/9999=667/3333.\u003cbr>المجموع 0.1+0.2+…+0.9 = 45/10 = 9/2.'],\n['الحقل المرتب والأرخميدية','(ℝ,+,×) حقل تبديلي مرتب ترتيباً كلياً. الأرخميدية: لكل x يوجد n∈ℕ حيث n>x. الجزء الصحيح: E(x)≤x \u003c E(x)+1، وE(x+1)=E(x)+1، وx≤y⇒E(x)≤E(y).\u003cdiv class=mt>E(2.853)=2 ، E(−3.5)=−4 ، {x}=x−E(x)\u003c/div>'],\n['القيمة المطلقة والكثافة','|x+y|≤|x|+|y| ، ||x|−|y||≤|x−y| ، √(x²)=|x|. max(x,y)=(x+y+|x−y|)/2 وmin(x,y)=(x+y−|x−y|)/2. ℚ وℝ∖ℚ كثيفتان في ℝ، وكذلك {r³ : r∈ℚ} لأن t↦t³ تزايدية تماماً.'],\n['الحد الأعلى والأدنى','sup A أصغر المكبورات وinf A أكبر المصغورات. شرط ε: M=sup A ⇔ M مكبور ولكل ε>0 يوجد s∈A حيث s>M−ε.\u003cdiv class=mt>sup(A∪B)=max(sup A, sup B)\u003cbr>inf(A+B)=inf A+inf B\u003cbr>sup(A−B)=sup A−inf B\u003c/div>'],\n['الأعداد الناطقة: تتمة','العدد ناطق ⇔ كتابته العشرية منتهية أو دورية. بين أي ناطقين يوجد غير ناطق: x=r+(r′−r)√2/2. المجالات: [a,b] مغلق، ]a,b[ مفتوح، والمستقيم المكتمل ℝ̄=ℝ∪{−∞,+∞}. المسافة: |x−a| \u003c r ⇔ x∈]a−r,a+r[.'],\n[V,'\u003cb>Rational number\u003c/b> — عدد ناطق\u003cbr>\u003cb>Irrational number\u003c/b> — عدد غير ناطق\u003cbr>\u003cb>Proof by contradiction\u003c/b> — برهان بالخلف\u003cbr>\u003cb>Absolute value\u003c/b> — القيمة المطلقة\u003cbr>\u003cb>Inequality\u003c/b> — متباينة\u003cbr>\u003cb>Upper bound\u003c/b> — حادّ من الأعلى\u003cbr>\u003cb>Lower bound\u003c/b> — حادّ من الأسفل\u003cbr>\u003cb>Supremum\u003c/b> — أصغر حاد من الأعلى\u003cbr>\u003cb>Infimum\u003c/b> — أكبر حاد من الأسفل\u003cbr>\u003cb>Maximum / Minimum\u003c/b> — القيمة العظمى / الصغرى\u003cbr>\u003cb>Dense set\u003c/b> — مجموعة كثيفة\u003cbr>\u003cb>Floor function\u003c/b> — دالة الجزء الصحيح']],\nq:[['x∈ℚ* وy∉ℚ، فإن x·y:',['ناطق','غير ناطق','قد يكون أيهما'],1,'لو كان xy=q ناطقاً لكان y=q/x ناطقاً: تناقض.'],\n['في برهان √2 نفترض الكسر p/q:',['زوجياً','مختزلاً gcd(p,q)=1','أصغر من 1'],1,'الاختزال هو الذي يتناقض مع كون p وq زوجيين معاً.'],\n['0.(45) تساوي:',['45/99 = 5/11','45/100','45/9'],0,'الدورة رقمان ⇒ نقسم على 99، ثم نختزل على 9.'],\n['E(−3.5) تساوي:',['−3','−4','3'],1,'E(x) أكبر عدد صحيح ≤ x، وهو −4.'],\n['sup{1/2−1/(2n) : n≥1} يساوي:',['0','1/2 وهو max','1/2 وليس max'],2,'القيمة 1/2 لا تُبلغ أبداً.']],\ne:['بيّن أن √2+√3 غير ناطق',['نفترض s=√2+√3 ناطقاً (s≠0).','√3−√2 = (3−2)/s = 1/s ناطق.','نجمع: 2√3 = s+1/s ناطق فـ √3 ناطق: تناقض ∎']],\nx:[['اكتب 2.1(6) على شكل كسر مختزل',['x=2.1666…، نضرب في 10 ليبدأ الدور بعد الفاصلة: 10x=21.666…','نضرب في 10 مرة أخرى: 100x=216.666…','نطرح: 90x=195 ⇒ x=195/90=13/6 ∎']],\n['بيّن أن (1+√2)·√2 غير ناطق',['√2 غير ناطق (تمرين 2) و1 ناطق ⇒ 1+√2 غير ناطق.','(1+√2)·√2 = √2 + 2.','مجموع غير ناطق وناطق ⇒ غير ناطق ∎']],\n['برهن بالخلف أن √3 غير ناطق',['نفترض √3=p/q مختزلاً: p²=3q².','3 أولي يقسم p² فيقسم p، p=3k ⇒ q²=3k².','إذن 3 يقسم q: تناقض مع الاختزال ∎']],\n['أثبت أن E(x)+E(y)≤E(x+y) ثم أعطِ مثالاً لعدم المساواة',['E(x)≤x وE(y)≤y فـ E(x)+E(y)≤x+y.','E(x)+E(y) عدد صحيح ≤ x+y، وE(x+y) أكبر صحيح ≤ x+y، إذن E(x)+E(y)≤E(x+y).','مثال لعدم المساواة: x=y=0.5 ⇒ 0+0 \u003c E(1)=1. ∎']],\n['حل |x−1|+|x+1|=4 ثم |√(x+1)−1|+|√(x+1)+1|=4',['x≤−1: −2x=4 ⇒ x=−2 مقبول. وفي ]−1,1[ نجد 2=4 مستحيل. وx≥1: 2x=4 ⇒ x=2. إذن S={−2,2}.','نضع u=√(x+1)≥0 فتصبح |u−1|+|u+1|=4 ⇒ u=2 (نرفض −2).','√(x+1)=2 ⇒ x=3. ∎']],\n['B={1/2−1/(2n) : n≥1}: أثبت أن inf B=0 وsup B=1/2',['b₁=0∈B وbₙ≥0 ⇒ inf B=min B=0.','bₙ دائماً أصغر من 1/2، ولكل ε>0 نأخذ n بحيث 1/(2n)\u003cε فيكون bₙ>1/2−ε.','إذن sup B=1/2، ولا يوجد max لأن 1/2∉B. ∎']],\n['عيّن sup وinf وmax وmin لـ A={(−1)ⁿ+1/n : n≥1}',['للزوجي 1+1/n≤3/2 (عند n=2)، وللفردي −1+1/n≤0.','a₂=3/2∈A ⇒ sup A=max A=3/2.','aₙ>−1 دائماً وa₂ₖ₋₁→−1 ⇒ inf A=−1 ولا يوجد min. ∎']],\n['أثبت: x∈ℚ وy∉ℚ ⇒ x+y∉ℚ، وإذا x≠0 فـ xy∉ℚ. ثم أثبت أن √a+√b غير ناطق (a,b∈ℚ⁺ و√a,√b∉ℚ)',['نفترض x+y=r∈ℚ فيكون y=r−x∈ℚ: تناقض. وإذا xy=q∈ℚ فـ y=q/x∈ℚ: تناقض.','نضع s=√a+√b∈ℚ. بالتربيع 2√(ab)=s²−a−b∈ℚ. ومن s(√a−√b)=a−b نجد √a−√b=(a−b)/s∈ℚ.','بالجمع √a=½(s+(a−b)/s)∈ℚ: تناقض. ∎']],\n['اكتب Nₙ=0.1997…1997 (n كتلة) وM=0.(2001) وP=0.1+0.2+…+0.9 على الشكل p/q',['Nₙ=1997·Σ₁ⁿ10⁻⁴ᵏ=1997(10⁴ⁿ−1)/(9999·10⁴ⁿ).','10000M=2001+M ⇒ 9999M=2001 ⇒ M=667/3333.','P=(1+2+…+9)/10=45/10=9/2. ∎']],\n['برهن max(x,y)=(x+y+|x−y|)/2 وmin(x,y)=(x+y−|x−y|)/2 ثم جد صيغة max(x,y,z)',['x≥y: |x−y|=x−y فتعطي الصيغتان x وy. x \u003c y: |x−y|=y−x فتعطيان y وx.','max(x,y,z)=max(max(x,y),z).','=(x+y+2z+|x−y|+|x+y+|x−y|−2z|)/4. ∎']],\n['برهن: √a+√b≤2√((a+b)/2) (a,b≥0)، a²+b²≥2ab، a²+b²+c²≥ab+bc+ca',['(√a−√b)²≥0 ⇒ 2√(ab)≤a+b ⇒ (√a+√b)²≤2(a+b).','بأخذ الجذر: √a+√b≤2√((a+b)/2). و(a−b)²≥0 ⇒ a²+b²≥2ab.','نجمع a²+b²≥2ab وb²+c²≥2bc وc²+a²≥2ca ثم نقسم على 2. ∎']],\n['استنتج متباينة كوشي–شفارتز من p(x)=Σ(aᵢ+xbᵢ)²',['p(x)=(Σbᵢ²)x²+2(Σaᵢbᵢ)x+Σaᵢ²≥0 لكل x.','كثير حدود من الدرجة 2 لا يغير إشارته ⇒ المميز المختصر Δ′≤0.','(Σaᵢbᵢ)²−(Σaᵢ²)(Σbᵢ²)≤0. ∎']],\n['x⁺=max(x,0) وx⁻=max(−x,0): أثبت x=x⁺−x⁻ و|x|=x⁺+x⁻',['x≥0: x⁺=x وx⁻=0 فالمجموع x والفرق x.','x \u003c 0: x⁺=0 وx⁻=−x فالفرق x والمجموع −x=|x|.','الحالتان تثبتان المطلوب. ∎']],\n['أثبت: x≤y ⇒ E(x)≤E(y) وE(x+1)=E(x)+1',['E(x)≤x≤y وE(x) صحيح فهو ≤ أكبر صحيح ≤ y أي E(y).','E(x)+1≤x+1 \u003c E(x)+2.','E(x)+1 صحيح فهو E(x+1). ∎']],\n['أثبت أن E={r³ : r∈ℚ} كثيفة في ℝ',['ليكن a \u003c b. t↦t^(1/3) تزايدية تماماً فـ a^(1/3) \u003c b^(1/3).','كثافة ℚ: يوجد r∈ℚ بين العددين.','نرفع للقوة 3: a \u003c r³ \u003c b. ∎']],\n['عيّن inf وsup وmax وmin: A₁=[0,1]∩ℚ، A₂=]0,1[∩ℚ، A₃=ℕ، A₄=[−1,1]∪{0,9}، A₅=]−4,4[∪{2,π}',['A₁: inf=min=0 وsup=max=1.','A₂: inf=0 وsup=1 بلا min ولا max. A₃: min=0 وغير مكبورة.','A₄=[−1,1]∪{9}: min=−1 وmax=9. A₅=]−4,4[: inf=−4 وsup=4 بلا min ولا max. ∎']],\n['C={uₙ} حيث uₙ=2n (n زوجي) وuₙ=2⁻ⁿ (n فردي)، وD={x : x² \u003c 2}',['u₂ₖ=4k→+∞ فـ C غير مكبورة ولا sup.','uₙ≥0 وu₀=0∈C فـ inf=min=0.','D=]−√2,√2[ فـ inf D=−√2 وsup D=√2 بلا min ولا max. ∎']],\n['A،B محدودتان: sup(A∪B)=max(sup A,sup B)، inf(A+B)=inf A+inf B، sup(A−B)=sup A−inf B',['∪: max(sup A,sup B) مكبور للاتحاد، وA،B⊂A∪B تعطي ≥.','+: a+b≥inf A+inf B، ومن شرط ε نجد a+b \u003c inf A+inf B+ε.','A−B=A+(−B) وsup(−B)=−inf B. ∎']]],\nh:['عالق في «الخلف»؟','اكتب بوضوح: «نفترض عكس المطلوب». ثم اشتق نتيجة تعارض معطى أو قاعدة معروفة، واختم: «فالفرض خاطئ».']},\n\n{t:'Chapter 2 — الأعداد المركبة',n:'الأعداد المركبة',\ns:[['التعريف','z=a+ib حيث a,b∈ℝ وi²=−1. الجزء الحقيقي Re(z)=a والجزء التخيلي Im(z)=b.\u003cdiv class=mt>z₁=z₂ ⇔ Re(z₁)=Re(z₂) وIm(z₁)=Im(z₂)\u003c/div>'],\n['العمليات والمرافق','إذا z=a+ib وw=c+id:\u003cdiv class=mt>z+w=(a+c)+i(b+d)\u003cbr>zw=(ac−bd)+i(ad+bc)\u003cbr>z̄=a−ib\u003c/div>كما أن z·z̄=|z|²=a²+b².'],\n['المعيار والحجة','|z|=√(a²+b²)، وهو المسافة من الأصل إلى النقطة (a,b). إذا z≠0 نكتب z=|z|(cosθ+i sinθ)، والزاوية محددة بترديد 2π.'],\n['الشكل المثلثي والأسّي','z=r(cosθ+i sinθ)=re^{iθ}. في الجداء نضرب المعيارين ونجمع الحجتين، وفي القسمة نقسم المعيارين ونطرح الحجتين.'],\n['القوى والجذور','صيغة دي موافر: [r(cosθ+i sinθ)]ⁿ=rⁿ(cos(nθ)+i sin(nθ)). جذور zⁿ=w لها المعيار ρ^(1/n) والحجج (φ+2kπ)/n.'],\n['التفسير الهندسي','يمثل z=a+ib النقطة M(a,b). و|z−z₀| يمثل المسافة بين النقطتين. والمعادلة |z−z₀|=R تمثل دائرة مركزها z₀ ونصف قطرها R.'],\n['الجذور التربيعية وحل المعادلات','لحساب √ω جبرياً نضع δ=x+iy مع δ²=ω فنحل: x²−y²=Re ω ، 2xy=Im ω ، x²+y²=|ω|. ثم z=(−b±δ)/(2a) حيث δ²=Δ.\u003cdiv class=mt>ω=5+12i: |ω|=13 ⇒ x²=9، y²=4 ⇒ δ=±(3+2i)\u003c/div>'],\n['التحويلات النقطية والمثلثات','الانسحاب: z′=z+a. الدوران: z′−ω=e^{iα}(z−ω). التحاكي: z′−ω=k(z−ω). لتحديد طبيعة مثلث نحسب (z_C−z_A)/(z_B−z_A): إذا كانت ±i فالمثلث قائم ومتساوي الساقين في A.'],\n['مجموعات النقط (جدول مرجعي)','\u003cdiv class=mt>|z−z_A|=R: دائرة مركزها A\u003cbr>|z−z_A|=|z−z_B|: محور القطعة [AB]\u003cbr>Re z=0: محور التراتيب، Im z=0: محور الفواصل\u003cbr>arg(z−z_A)=θ [2π]: نصف مستقيم مبدؤه A ما عدا A\u003cbr>arg(z−z_A)=θ [π]: مستقيم يمر بـ A ما عدا A\u003cbr>(z−z_A)/(z−z_B) حقيقي: المستقيم (AB) ما عدا A وB\u003cbr>(z−z_A)/(z−z_B) تخيلي صرف: دائرة قطرها [AB] ما عدا B\u003cbr>|z|²=z+z̄: دائرة مركزها 1 ونصف قطرها 1\u003cbr>Re(z²)=0: المنصفان y=±x\u003c/div>'],\n[V,'\u003cb>Complex number\u003c/b> — عدد مركب\u003cbr>\u003cb>Real part\u003c/b> — الجزء الحقيقي\u003cbr>\u003cb>Imaginary part\u003c/b> — الجزء التخيلي\u003cbr>\u003cb>Conjugate\u003c/b> — المرافق\u003cbr>\u003cb>Modulus\u003c/b> — المعيار\u003cbr>\u003cb>Argument\u003c/b> — الحجة / الزاوية\u003cbr>\u003cb>Algebraic form\u003c/b> — الشكل الجبري\u003cbr>\u003cb>Trigonometric form\u003c/b> — الشكل المثلثي\u003cbr>\u003cb>Exponential form\u003c/b> — الشكل الأسي\u003cbr>\u003cb>De Moivre’s formula\u003c/b> — صيغة دي موافر\u003cbr>\u003cb>Roots\u003c/b> — الجذور\u003cbr>\u003cb>Complex plane\u003c/b> — المستوي المركب']],\nq:[['إذا z=3−2i فإن Re(z), Im(z):',['3 و−2','−2 و3','3 و2'],0,'نقرأ الجزأين من الصورة الجبرية.'],\n['مرافق 4+5i هو:',['4−5i','−4+5i','−4−5i'],0,'نغير إشارة الجزء التخيلي فقط.'],\n['|1+i| يساوي:',['1','√2','2'],1,'|z|=√(1²+1²)=√2.'],\n['حجة جداء عددين مركبين غير معدومين تساوي:',['مجموع الحجتين','فرق الحجتين','حاصل ضرب الحجتين'],0,'في الجداء نجمع الحجتين.'],\n['الجذور التربيعية للعدد 5+12i هي:',['±(3+2i)','±(2+3i)','±(5+12i)'],0,'(3+2i)²=9−4+12i=5+12i.'],\n['المعادلة |z−z_A|=|z−z_B| تمثل:',['دائرة','محور القطعة [AB]','نصف مستقيم'],1,'المسافتان إلى A وB متساويتان.']],\ne:['اكتب z=1+i√3 بالشكل المثلثي والأسّي',['المعيار r=√(1+3)=2.','cosθ=1/2 وsinθ=√3/2، إذن θ=π/3.','z=2(cos(π/3)+i sin(π/3))=2e^{iπ/3}. ∎']],\nx:[['احسب (2+i)(1−3i)',['نوسع: 2−6i+i−3i².','بما أن i²=−1 نحصل على 2−5i+3.','النتيجة 5−5i. ∎']],\n['حل z²=−4 في ℂ',['نكتب −4=4e^{i(π+2kπ)}.','الجذران معيارهما 2 وحجتاهما π/2 و3π/2.','إذن z=2i أو z=−2i. ∎']],\n['أثبت |z+w|≤|z|+|w|',['نستعمل |z+w|²=|z|²+|w|²+2Re(z w̄).','وبما أن Re(z w̄)≤|z||w|، نحصل على |z+w|²≤(|z|+|w|)².','بأخذ الجذر نحصل على المطلوب. ∎']],\n['z₃=(1+i√3)/(1+i): استنتج cos(π/12) وsin(π/12)',['جبرياً: z₃=(1+i√3)(1−i)/2=(1+√3)/2+i(√3−1)/2.','أسّياً: z₃=2e^{iπ/3}/(√2e^{iπ/4})=√2e^{iπ/12}.','بالمطابقة: cos(π/12)=(√6+√2)/4 وsin(π/12)=(√6−√2)/4. ∎']],\n['خطّط cos³θ',['cos³θ=(e^{iθ}+e^{−iθ})³/8=(e^{3iθ}+3e^{iθ}+3e^{−iθ}+e^{−3iθ})/8.','نجمع المترافقات: (2cos3θ+6cosθ)/8.','cos³θ=¼cos3θ+¾cosθ. ∎']],\n['حل (1+i)z²+z−2−i=0 مستعملاً ω=5+12i',['Δ=1+4(1+i)(2+i)=5+12i=ω وجذراه ±(3+2i).','z₁=(−1+3+2i)/(2(1+i))=1.','z₂=(−4−2i)/(2(1+i))=−3/2+i/2. ∎']],\n['متى يكون (√3+i)ⁿ حقيقياً؟ تخيلياً صرفاً؟',['√3+i=2e^{iπ/6} فـ Z=2ⁿ(cos(nπ/6)+i sin(nπ/6)).','حقيقي: sin(nπ/6)=0 ⇒ n=6k.','تخيلي صرف: cos(nπ/6)=0 ⇒ n=3+6k. ∎']],\n['L(z)=z(z̄−4(1−i√3))−4i(x√3−y)+12: عيّن L(z)=0 واحسب ω²⁰¹⁶',['الأجزاء التخيلية تتلاشى: L=x²+y²−4x−4√3y+12.','(x−2)²+(y−2√3)²=4: دائرة مركزها Ω(2+2√3i) ونصف قطرها 2.','ω=2+2√3i=4e^{iπ/3} ⇒ ω²⁰¹⁶=4²⁰¹⁶e^{i672π}=2⁴⁰³². ∎']],\n['A(−2−i)، B(1−2i)، C(−1+2i): بيّن أن ABC متساوي الساقين وقائم في A',['z_B−z_A=3−i ⇒ AB=√10، وz_C−z_A=1+3i ⇒ AC=√10.','(1+3i)/(3−i)=(1+3i)(3+i)/10=i.','النسبة i=e^{iπ/2}: طويلتها 1 وعمدتها π/2. ∎']],\n['اكتب بالشكلين الجبري والأسي: (1+i)²، (1−i)³، (1+i√3)/(1−i)',['(1+i)²=2i=2e^{iπ/2}.','1−i=√2e^{−iπ/4} ⇒ (1−i)³=2√2e^{−3iπ/4}=−2−2i.','(1+i√3)/(1−i)=√2e^{i7π/12}، وبضرب البسط والمقام في (1+i): ((1−√3)+i(1+√3))/2. ∎']],\n['أسّي بـ r>0: −√3+i، sinθ−i cosθ، 1+cosθ+i sinθ (θ∈]−π,π[)، 1+i tanθ (θ∈]−π/2,π/2[)',['−√3+i: r=2 وθ=5π/6 ⇒ 2e^{i5π/6}.','sinθ−i cosθ=cos(π/2−θ)−i sin(π/2−θ)=e^{i(θ−π/2)}.','1+cosθ+i sinθ=2cos(θ/2)e^{iθ/2} (لأن cos(θ/2) > 0). 1+i tanθ=e^{iθ}/cosθ. ∎']],\n['احسب z₁=(2+2√3i)/(√6+√2i)، z₂=((√3+i)/(8i))²، z₄=(1+i)⁴/(√3−i)³',['z₁=4e^{iπ/3}/(2√2e^{iπ/6})=√2e^{iπ/6}=√6/2+i√2/2.','z₂=(¼e^{−iπ/3})²=(1/16)e^{−2iπ/3}=−1/32−i√3/32.','z₄=−4/(−8i)=−i/2=½e^{−iπ/2}. ∎']],\n['z₃=[1+i−√3(1−i)/(1+i)]²',['(1−i)/(1+i)=−i فالقوس يساوي 1+i(1+√3).','z₃=1−(1+√3)²+2i(1+√3)=−(3+2√3)+2(1+√3)i.','|z₃|=5+2√3. تنبيه: arctan(1+√3)≈69.9° وليس 75°، فالحجة 2arctan(1+√3)≈139.8°. ∎']],\n['هل z=−2e^{iθ} هو الشكل الأسي لـ z=−2cosθ−2i sinθ؟',['لا: الطويلة يجب أن تكون موجبة وهنا −2.','z=−2(cosθ+i sinθ)=2e^{iπ}e^{iθ}.','z=2e^{i(θ+π)}: |z|=2 وarg z=θ+π. ∎']],\n['حل z²−(1+4i)z−3+3i=0',['Δ=(1+4i)²−4(−3+3i)=−3−4i، وجذراه ±(1−2i).','z₁=((1+4i)+(1−2i))/2=1+i.','z₂=((1+4i)−(1−2i))/2=3i. ∎']],\n['حل z²+(3i−4)z+1−7i=0',['Δ=(3i−4)²−4(1−7i)=3+4i=(2+i)².','z₁=(4−3i+2+i)/2=3−i.','z₂=(4−3i−2−i)/2=1−2i. ∎']],\n['TD2-8: |1+iz|=|1−iz| ⇒ ؟ ثم الجذور التكعيبية لـ w=(√3+i)/(√3 i)',['z=x+iy: (1−y)²+x²=(1+y)²+x² ⇒ y=0 فـ z∈ℝ.','(E): بأخذ الطويلة |(1+iz)/(1−iz)|ⁿ=1 فالحلول حقيقية، وz_k=tan((α+2kπ)/(2n)) مع α=2arctan a.','w=(2/√3)e^{−iπ/3} فالجذور (4/3)^(1/6)e^{i(−π+6kπ)/9}، k=0,1,2. ∎']],\n['عيّن مجموعة M(z): |z−2+i|=3، |z−i|=|z+2|، arg(z−1−i)=π/4 [2π]',['دائرة مركزها A(2,−1) ونصف قطرها 3.','محور القطعة [AB] مع A(0,1) وB(−2,0): 4x+2y+3=0.','نصف مستقيم مبدؤه A(1,1) باتجاه π/4 ما عدا A. ∎']],\n['عيّن: |z+5i|=2، |z−3+i|=|z−5|، arg z=π/4 [π]',['دائرة مركزها A(0,−5) ونصف قطرها 2.','محور [AB] مع A(3,−1) وB(5,0): 4x+2y−15=0.','المستقيم y=x ما عدا O. ∎']],\n['A(1+i)، B(2+i√3)، C(1+i√3): طبيعة المثلث ABC',['z_A−z_C=i(1−√3) وz_B−z_C=1.','النسبة تخيلية صرفة.','الزاوية في C قائمة، CA=√3−1 وCB=1. ∎']],\n['الدوران R مركزه Ω(1+i) وزاويته −π/3: عبارته وصورة A(2)',['z′−(1+i)=e^{−iπ/3}(z−1−i).','z′=(½−i√3/2)z+(1−√3)/2+i(1+√3)/2.','z′_A−(1+i)=(½−i√3/2)(1−i) ⇒ z′_A=(3−√3)/2+i(1−√3)/2. ∎']],\n['TD2-10: z′=(z+4i)/(z+2): D={|z′|=1} وE={z′∈ℝ}، ودوران مركزه i وزاويته −π/3',['|z′|=1 ⇔ MP=MQ مع P(0,−4) وQ(−2,0): D محور [PQ]، x−2y−3=0.','z′∈ℝ ⇔ M∈(PQ)∖{Q}: 2x+y+4=0.','الدوران: z′=(½−i√3/2)z−√3/2+i/2. ∎']]],\nh:['كيف أحدد الحجة؟','احسب المعيار أولاً، ثم حدد الزاوية من إشارات الجزأين الحقيقي والتخيلي. لا تعتمد على arctan وحده دون تحديد الربع.']},\n\n{t:'Chapter 3 — المتتاليات',n:'المتتاليات',\ns:[['التعريف وطرق التعريف','المتتالية دالة من ℕ إلى ℝ، نرمز لحدها العام uₙ.\u003cdiv class=mt>صريحة: uₙ=f(n) — بالتراجع: u₀ مع uₙ₊₁=f(uₙ)\u003c/div>'],\n['الرتابة','ندرس إشارة uₙ₊₁−uₙ: إذا كانت موجبة فالمتتالية متزايدة، وإذا كانت سالبة فهي متناقصة. ويمكن استعمال uₙ₊₁/uₙ−1 عندما تكون الحدود موجبة.'],\n['المحدودية والتقارب','المتزايدة والمحدودة من الأعلى متقاربة، والمتناقصة والمحدودة من الأسفل متقاربة. إذا تقاربت uₙ₊₁=f(uₙ) وكانت f مستمرة، فإن نهايتها ℓ تحقق ℓ=f(ℓ). حل المعادلة وحده لا يثبت التقارب.'],\n['الحسابية والهندسية','حسابية أساسها r: uₙ=u₀+nr، ومجموع n+1 حدود S=(n+1)(u₀+uₙ)/2.\u003cbr>هندسية أساسها q: uₙ=u₀qⁿ، ومجموعها إذا q≠1 هو S=u₀(1−qⁿ⁺¹)/(1−q).'],\n['المتتاليات الجزئية','كل متتالية حقيقية محدودة لها متتالية جزئية متقاربة (بولتسانو–فايرشتراس). وتفيد المتتاليات الجزئية في اختبار وجود النهاية.'],\n['المتتاليتان المتجاورتان','uₙ تزايدية وvₙ تناقصية وuₙ−vₙ→0 ⇒ تتقاربان نحو نفس النهاية ℓ، وuₙ≤ℓ≤vₙ. مثال: uₙ=1−1/n وvₙ=1+1/n.'],\n['المتتاليات التراجعية وكوشي','uₙ₊₁=f(uₙ): إذا f تزايدية ومستمرة على [a,b] مستقرة فالمتتالية رتيبة ومتقاربة نحو حل f(ℓ)=ℓ. وإذا f تناقصية فالجزئيتان u₂ₙ وu₂ₙ₊₁ تتقاربان نحو حلين للمعادلة f∘f(ℓ)=ℓ. متتالية كوشي: ∀ε ∃N ∀p,q≥N |u_p−u_q|\u003cε، وهي مكافئة للتقارب في ℝ، وكل متتالية كوشي محدودة.'],\n['نهاية متتالية وعملياتها','uₙ→ℓ ⇔ ∀ε>0 ∃N ∀n≥N: |uₙ−ℓ|\u003cε. النهاية وحيدة، وكل متقاربة محدودة. العمليات (مجموع، جداء، حاصل قسمة) تحفظ النهاية، والأشكال غير المعينة: ∞−∞، 0×∞، ∞/∞، 0/0. الانتقال إلى النهاية في ≤ يعطي ≤ (لا \u003c ). مبرهنة الحصر: uₙ≤wₙ≤vₙ وuₙ,vₙ→ℓ ⇒ wₙ→ℓ. المتزايدة غير المكبورة تؤول إلى +∞.'],\n[V,'\u003cb>Sequence\u003c/b> — متتالية\u003cbr>\u003cb>General term\u003c/b> — الحد العام\u003cbr>\u003cb>Explicit formula\u003c/b> — صيغة صريحة\u003cbr>\u003cb>Recursive definition\u003c/b> — تعريف بالتراجع\u003cbr>\u003cb>Increasing\u003c/b> — متزايدة\u003cbr>\u003cb>Decreasing\u003c/b> — متناقصة\u003cbr>\u003cb>Monotonicity\u003c/b> — الرتابة\u003cbr>\u003cb>Bounded\u003c/b> — محدودة\u003cbr>\u003cb>Convergent\u003c/b> — متقاربة\u003cbr>\u003cb>Divergent\u003c/b> — متباعدة\u003cbr>\u003cb>Arithmetic sequence\u003c/b> — متتالية حسابية\u003cbr>\u003cb>Geometric sequence\u003c/b> — متتالية هندسية\u003cbr>\u003cb>Subsequence\u003c/b> — متتالية جزئية']],\nq:[['إذا uₙ₊₁−uₙ موجب دائماً فالمتتالية:',['متزايدة','متناقصة','ثابتة'],0,'هذه هي قاعدة دراسة الرتابة.'],\n['uₙ=5+3n متتالية:',['هندسية','حسابية أساسها 3','حسابية أساسها 5'],1,'الفرق بين حدين متتاليين يساوي 3.'],\n['المتزايدة والمحدودة من الأعلى:',['متقاربة','متباعدة','دورية بالضرورة'],0,'هذه مبرهنة تقارب المتتاليات الرتيبة.'],\n['إذا تقاربت uₙ₊₁=f(uₙ) وf مستمرة، فإن النهاية ℓ تحقق:',['ℓ=f(ℓ)','ℓ=0 دائماً','f(ℓ)=1'],0,'نمرر النهاية في العلاقة باستعمال الاستمرارية.'],\n['uₙ=1−1/n وvₙ=1+1/n:',['متجاورتان','متباعدتان','متناقصتان'],0,'الأولى تزايدية والثانية تناقصية وفرقهما يؤول إلى 0.'],\n['إذا وُجدت جزئيتان نهايتاهما مختلفتان فالمتتالية:',['متقاربة','متباعدة','محدودة دوماً'],1,'نتيجة مبرهنة المتتاليات الجزئية.']],\ne:['ادرس تقارب u₀=0 وuₙ₊₁=(uₙ+3)/2',['نثبت بالتراجع أن 0≤uₙ≤3.','uₙ₊₁−uₙ=(3−uₙ)/2≥0، إذن هي متزايدة.','هي متزايدة ومحدودة من الأعلى، إذن متقاربة.','إذا كانت نهايتها ℓ فإن ℓ=(ℓ+3)/2، ومنه ℓ=3. ∎']],\nx:[['أثبت أن 1/n→0 بالتعريف',['نأخذ ε>0 ونختار N>1/ε.','إذا n≥N فإن 0\u003c1/n≤1/N\u003cε.','إذن حسب تعريف النهاية 1/n→0. ∎']],\n['احسب نهاية uₙ=n/(n+1)',['نقسم البسط والمقام على n.','uₙ=1/(1+1/n).','بما أن 1/n→0 فإن uₙ→1. ∎']],\n['رتابة وحدود: (2) uₙ=(n²−25)/(2n²+1) و(6) uₙ=√(n+1)−√n',['(2): uₙ=½−51/(2(2n²+1)) تزايدية ومحدودة بـ −25≤uₙ\u003c½.','(6): uₙ=1/(√(n+1)+√n) فهي تناقصية.','وهي محدودة: uₙ∈]0,1]. ∎']],\n['uₙ=∏ₖ₌₂ⁿ(1−1/k²): احسب uₙ ونهايتها',['1−1/k²=(k−1)(k+1)/k².','∏(k−1)/k=1/n و∏(k+1)/k=(n+1)/2.','uₙ=(n+1)/(2n)→½. ∎']],\n['uₙ=1+1/2!+…+1/n! وvₙ=uₙ+1/(n·n!): بيّن أنهما متجاورتان',['uₙ₊₁−uₙ=1/(n+1)!>0 فـ uₙ تزايدية.','vₙ₊₁−vₙ=−1/(n!·n(n+1)²)\u003c0 فـ vₙ تناقصية.','vₙ−uₙ=1/(n·n!)→0 فهما متجاورتان. ∎']],\n['u₀=1 وuₙ₊₁=√(1+uₙ): أثبت التقارب واحسب النهاية',['نضع φ=(1+√5)/2 فـ φ²=1+φ. بالتراجع uₙ≤φ لأن √(1+uₙ)≤√(1+φ)=φ.','uₙ₊₁²−uₙ²=1+uₙ−uₙ²≥0 لأن 1≤uₙ≤φ، فهي تزايدية ومحدودة إذن متقاربة.','ℓ²=1+ℓ ⇒ ℓ=(1+√5)/2. ∎']],\n['TD3-1: رتابة وحدود (1) (−1)ⁿ (3) n²+1 (4) (−1)ⁿ/n (5) (2n+1)/(n+2) (7) n/2ⁿ (8) sin(1/n) (9) (1+1/n)ⁿ',['(1) محدودة بـ 1 وليست رتيبة. (3) تزايدية غير مكبورة. (4) |uₙ|≤1 وإشارتها متناوبة فليست رتيبة.','(5)=2−3/(n+2) تزايدية و½≤uₙ \u003c 2. (7) uₙ₊₁/uₙ=(n+1)/(2n)≤1 فهي تناقصية من n≥1 وليست رتيبة من 0، و0≤uₙ≤½.','(8) 1/n تناقصية في ]0,1] حيث sin تزايدية فهي تناقصية ومحدودة. (9) تزايدية ومحدودة بـ 3 (نهايتها e). ∎']],\n['TD3-2: بالتعريف (1) lim 3√n/(4√n+100)=3/4 (2) lim (n+(−1)ⁿ)/(n+1)=1',['(1) |u−3/4|=75/(4√n+100) \u003c 75/(4√n) \u003c ε ⇐ n > (75/(4ε))².','نأخذ N=E((75/(4ε))²)+1.','(2) |u−1|=|(−1)ⁿ−1|/(n+1)≤2/(n+1) \u003c 2/n \u003c ε ⇐ N=E(2/ε)+1. ∎']],\n['TD3-3: uₙ=√n/(n+1)، vₙ=cos n، wₙ=uₙvₙ',['0≤uₙ≤1/√n فـ uₙ→0.','|vₙ|≤1 فهي محدودة.','|wₙ|≤uₙ→0 فـ wₙ→0 (جداء متتالية صفرية بمحدودة). ∎']],\n['TD3-5: (1) |(n²−2)/(2n²−9)| > ½ لكل n≥3 (2) uₙ لا تؤول إلى 0',['n≥3 ⇒ 2n²−9 > 0، و2(n²−2)=2n²−4 > 2n²−9 فالنسبة > ½.','نأخذ ε=½: لكل N يوجد n≥max(N,3) بحيث |uₙ| > ε.','إذن uₙ لا تؤول إلى 0. ∎']],\n['TD3-6: uₙ=(2ⁿ+(−1)ⁿ)/2ⁿ: أثبت uₙ→1 وعيّن الحدود خارج ]1−10⁻⁴,1+10⁻⁴[',['uₙ=1+(−½)ⁿ→1.','|uₙ−1|=2⁻ⁿ، وخارج المجال: 2⁻ⁿ≥10⁻⁴ ⇔ 2ⁿ≤10⁴.','2¹³=8192 و2¹⁴=16384 فالحدود u₀…u₁₃ خارج المجال. ∎']],\n['TD3-8: uₙ=1−½+⅓−…+(−1)ⁿ⁺¹/n: هل u₂ₙ وu₂ₙ₊₁ متجاورتان؟ هل uₙ متقاربة؟',['u₂ₙ₊₂−u₂ₙ=1/(2n+1)−1/(2n+2) > 0 فـ u₂ₙ تزايدية.','u₂ₙ₊₃−u₂ₙ₊₁=−1/(2n+2)+1/(2n+3) \u003c 0 فـ u₂ₙ₊₁ تناقصية، وu₂ₙ₊₁−u₂ₙ=1/(2n+1)→0.','متجاورتان فلهما نفس النهاية، إذن uₙ متقاربة. ∎']],\n['TD3-9: lim sup وlim inf لـ (−1)ⁿ، n^((−1)ⁿ)، −n²',['(−1)ⁿ: limsup=1 وliminf=−1.','n^((−1)ⁿ): الزوجية →+∞ والفردية 1/n→0 فـ limsup=+∞ وliminf=0.','−n²: كلاهما −∞. ∎']],\n['TD3-10: u₀ \u003c v₀، uₙ₊₁=√(uₙvₙ) وvₙ₊₁=(uₙ+vₙ)/2: أثبت التقارب إلى نفس النهاية',['(√a−√b)²≥0 ⇒ √(ab)≤(a+b)/2 فـ uₙ≤vₙ.','vₙ₊₁−vₙ=(uₙ−vₙ)/2≤0 تناقصية، وuₙ₊₁=√(uₙvₙ)≥uₙ تزايدية.','uₙ≤vₙ≤v₀ فكلتاهما متقاربة، ومن vₙ₊₁=(uₙ+vₙ)/2 نجد ℓ′=(ℓ+ℓ′)/2 أي ℓ=ℓ′. ∎']],\n['TD3-11: 0 \u003c uₙ \u003c 1 وuₙ(1−uₙ₊₁) > ¼ (قراءتي للنص): أثبت التقارب وجد inf E وsup E',['uₙ₊₁(1−uₙ₊₁)≤¼ \u003c uₙ(1−uₙ₊₁) و1−uₙ₊₁ > 0 ⇒ uₙ₊₁ \u003c uₙ.','تناقصية ومحدودة بـ 0 فتتقارب نحو ℓ، وuₙ(1−uₙ₊₁)>¼ تعطي ℓ(1−ℓ)≥¼ أي (ℓ−½)²≤0 فـ ℓ=½.','sup E=u₀ (max) وinf E=½ غير محقق. ∎']],\n['TD3-12 (3): v₀=1 وvₙ₊₁=√(1+vₙ²)',['vₙ₊₁²=vₙ²+1 فـ vₙ²=n+1.','vₙ=√(n+1) تزايدية.','وغير مكبورة (→+∞). ∎']],\n['TD3-13: بتعريف كوشي: (1) uₙ=Σ1/k² متقاربة (2) vₙ=1+1/ln2+…+1/ln n متباعدة',['(1) q > p≥N: |u_q−u_p|=Σ₍ₚ₊₁₎^q 1/k² ≤ Σ 1/(k(k−1)) = 1/p−1/q \u003c 1/N \u003c ε.','(2) |v₂ₙ−vₙ|=Σ₍ₙ₊₁₎^(2n) 1/ln k ≥ n/ln(2n) ≥ n/(2n)=½.','ليست كوشي (ε=½) فمتباعدة. ∎']]],\nh:['كيف أدرس متتالية بالتراجع؟','أثبت أولاً مجال الحدود بالتراجع، ثم ادرس الرتابة، ثم المحدودية. بعد إثبات التقارب فقط، مرّر النهاية في العلاقة التراجعية.']},\n\n{t:'Chapter 4 — النهايات',n:'النهايات',\ns:[['نهاية دالة عند نقطة','نقول lim(x→a)f(x)=ℓ إذا اقتربت قيم f(x) من ℓ عندما يقترب x من a. النهاية لا يلزم أن تساوي f(a)، وقد توجد حتى لو لم تكن الدالة معرفة عند a.'],\n['النهايتان الجانبيتان','النهاية عند a موجودة إذا وفقط إذا وجدت النهاية اليمنى واليسرى وكانتا متساويتين:\u003cdiv class=mt>lim(x→a⁻)f(x)=lim(x→a⁺)f(x)=ℓ\u003c/div>'],\n['الأشكال غير المعينة','الأشكال المشهورة: 0/0، ∞/∞، ∞−∞، 0×∞، 1^∞، 0⁰، ∞⁰. لا نحكم على النهاية من الشكل وحده؛ نعالجها بالتحليل أو المرافق أو توحيد المقامات أو اللوغاريتم.'],\n['نهايات مرجعية عند الصفر','\u003cdiv class=mt>lim(x→0) sin(x)/x=1\u003cbr>lim(x→0)(1−cos x)/x²=1/2\u003cbr>lim(x→0)(eˣ−1)/x=1\u003cbr>lim(x→0)ln(1+x)/x=1\u003c/div>في النهايات المثلثية يجب استعمال الراديان.'],\n['النهايات عند المالانهاية','في كسر كثيرات الحدود نقارن أعلى درجة: تساوي الدرجتين يعطي نسبة المعاملين الرئيسيين، وإذا درجة البسط أصغر فالنهاية صفر، وإذا كانت أكبر ندرس الحد الغالب وإشارته.'],\n['المقاربـات','إذا f(x)→±∞ عندما x→a فـ x=a مقارب عمودي. وإذا f(x)→L عند ±∞ فـ y=L مقارب أفقي. وإذا f(x)−(mx+p)→0 فـ y=mx+p مقارب مائل.'],\n['الدوال: الخواص العامة','f:D→ℝ ومنحناها C_f. زوجية: f(−x)=f(x) (تناظر حول محور التراتيب)، فردية: f(−x)=−f(x) (تناظر حول المبدأ)، دورية: f(x+T)=f(x). محدودة ⇔ ∃M: |f|≤M. مثال: cos محدودة بـ 1، و1/x فردية على ℝ*.'],\n['تعريف النهاية (ε,δ) والمتتاليات','∀ε>0 ∃δ>0: |x−x₀|\u003cδ ⇒ |f(x)−ℓ|\u003cε. مثال: lim(3x+1)=7 عند 2 بأخذ δ=ε/3. لإثبات عدم وجود نهاية نأخذ xₙ,yₙ→x₀ مع f(xₙ) وf(yₙ) لهما نهايتان مختلفتان (مثل sin(1/x) عند 0). مبرهنة الحصر: h≤f≤g وh,g→ℓ ⇒ f→ℓ.'],\n['الاستمرارية وأنواع الانقطاع','f مستمرة عند x₀ ⇔ lim f=f(x₀). انقطاع من النوع الأول: النهايتان الجانبيتان موجودتان ومنتهيتان لكن f غير مستمرة. والنوع الثاني غير ذلك (مثل 1/(x−1) عند 1). التمديد بالاستمرار: إذا lim f=ℓ عند x₀∉D نعرّف f̃(x₀)=ℓ. المركب: f مستمرة عند x₀ وg عند f(x₀) ⇒ g∘f مستمرة عند x₀.\u003cdiv class=mt>(2x²−x−1)/(x−1)=2x+1 ⇒ f̃(1)=3\u003c/div>'],\n['الاستمرار المنتظم والمبرهنات الأساسية','منتظمة: ∀ε ∃δ ∀x,y: |x−y|\u003cδ ⇒ |f(x)−f(y)|\u003cε. ليبشيتز ⇒ منتظمة ⇒ مستمرة. هاينه: المستمرة على قطعة [a,b] منتظمة الاستمرار. وعلى قطعة تكون f محدودة وتبلغ حديها. مبرهنة القيم المتوسطة: f مستمرة على [a,b] وf(a)f(b)\u003c0 ⇒ ∃c∈]a,b[: f(c)=0. الدالة العكسية: مستمرة ورتيبة تماماً ⇒ f⁻¹ مستمرة (مثل ln).'],\n['المقارنة: Landau والتكافؤ','f=O(g) إذا كانت f/g محدودة، f=o(g) إذا f/g→0، f∼g إذا f/g→1. عند 0: sin x∼x ، ln(1+x)∼x ، eˣ−1∼x ، 1−cos x∼x²/2. تحذير: التكافؤ يُستعمل في الجداء والقسمة فقط، لا في الجمع والطرح.'],\n[V,'\u003cb>Limit\u003c/b> — نهاية\u003cbr>\u003cb>Left-hand limit\u003c/b> — النهاية اليسرى\u003cbr>\u003cb>Right-hand limit\u003c/b> — النهاية اليمنى\u003cbr>\u003cb>Indeterminate form\u003c/b> — شكل غير معين\u003cbr>\u003cb>Conjugate\u003c/b> — المرافق\u003cbr>\u003cb>Dominant term\u003c/b> — الحد الغالب\u003cbr>\u003cb>Asymptote\u003c/b> — مقارب\u003cbr>\u003cb>Vertical asymptote\u003c/b> — مقارب عمودي\u003cbr>\u003cb>Horizontal asymptote\u003c/b> — مقارب أفقي\u003cbr>\u003cb>Oblique asymptote\u003c/b> — مقارب مائل\u003cbr>\u003cb>Continuity\u003c/b> — استمرارية\u003cbr>\u003cb>Intermediate Value Theorem\u003c/b> — مبرهنة القيم المتوسطة']],\nq:[['إذا اختلفت النهاية اليمنى واليسرى فإن النهاية الثنائية:',['موجودة','غير موجودة','تساوي صفراً'],1,'تساوي النهايتين الجانبيتين شرط وجود النهاية.'],\n['lim(x→0) sin(5x)/x يساوي:',['1','5','0'],1,'نكتب 5·sin(5x)/(5x).'],\n['lim(x→∞)(4x²+x)/(2x²−1) يساوي:',['2','4','∞'],0,'نقسم على x² فنحصل على نسبة المعاملين 4/2.'],\n['إذا f(x)→∞ عندما x→a فإن x=a:',['مقارب أفقي','مقارب عمودي','مقارب مائل'],1,'التباعد إلى مالانهاية قرب a يعطي مقارباً عمودياً.'],\n['lim(x→0)(eˣ−1)/x تساوي:',['0','1','∞'],1,'نهاية مرجعية.'],\n['f مستمرة على [a,b] وf(a)f(b)\u003c0 فإن:',['f تنعدم في ]a,b[','f متزايدة','f ثابتة'],0,'مبرهنة القيم المتوسطة.']],\ne:['احسب lim(x→0)(√(1+x)−1)/x',['الشكل 0/0، فنضرب في المرافق.','نحصل على [(1+x)−1]/[x(√(1+x)+1)].','بعد الاختزال تصبح 1/(√(1+x)+1)، والنهاية 1/2. ∎']],\nx:[['احسب lim(x→2)(x²−4)/(x−2)',['بالتعويض نحصل على 0/0.','نحلل x²−4=(x−2)(x+2).','بعد الاختزال النهاية lim(x→2)(x+2)=4. ∎']],\n['احسب lim(x→∞)(3x³−x)/(2x³+5x²+1)',['نقسم البسط والمقام على x³.','تصبح (3−1/x²)/(2+5/x+1/x³).','الحدود التي فيها 1/x تؤول إلى صفر، فالنتيجة 3/2. ∎']],\n['احسب lim(x→0)(1−cos(2x))/x²',['نكتبها 4·(1−cos(2x))/(2x)².','نستعمل النهاية المرجعية (1−cos t)/t²→1/2.','النهاية 4×1/2=2. ∎']],\n['احسب lim(x→0)(1−cos x)sin x/(x²ln(1+x))',['1−cos x∼x²/2 وsin x∼x وln(1+x)∼x.','f(x)∼(x²/2·x)/(x²·x)=1/2.','النهاية ½. ∎']],\n['f(x)=(2x²−x−1)/(x−1) على ℝ∖{1}: هل تقبل تمديداً بالاستمرار؟',['2x²−x−1=(x−1)(2x+1) فـ f(x)=2x+1 عندما x≠1.','lim(x→1)f(x)=3.','f̃(1)=3 تمديد مستمر. ∎']],\n['بيّن أن x⁵−3x−2=0 تقبل حلاً في ]1,2[',['f مستمرة على [1,2] لأنها كثير حدود.','f(1)=−4 وf(2)=24 ⇒ f(1)f(2)\u003c0.','حسب مبرهنة القيم المتوسطة ∃c∈]1,2[: f(c)=0. ∎']],\n['ادرس استمرار f(x)=|x−3|/(x−3) عند 3',['f(3⁺)=1 وf(3⁻)=−1.','النهايتان موجودتان ومختلفتان وf غير معرفة عند 3.','انقطاع من النوع الأول. ∎']],\n['أثبت أن f(x)=x² منتظمة الاستمرار على [0,1]',['|x²−y²|=|x−y||x+y|≤2|x−y|.','نأخذ δ=ε/2.','إذن |x−y|\u003cδ ⇒ |f(x)−f(y)|\u003cε. ∎']],\n['بالتعريف: lim(x→1) 2/(x−1)²=+∞',['A>0 نبحث عن δ: 2/(x−1)² > A ⇔ |x−1| \u003c √(2/A).','نأخذ δ=√(2/A).','إذن |x−1| \u003c δ ⇒ f(x) > A. ∎']],\n['f(x)=cos(ln|x|) ليس لها نهاية عند 0',['xₙ=e^(−2πn) وyₙ=e^(−π/2−2πn) كلتاهما →0.','f(xₙ)=cos(−2πn)=1 بينما f(yₙ)=cos(−π/2−2πn)=0.','نهايتان مختلفتان للصور ⇒ لا نهاية. ∎']],\n['f(x)=sin(1/x) (f(0)=0): هل f مستمرة عند 0؟',['xₙ=1/(π/2+2πn) فـ f(xₙ)=1.','yₙ=1/(3π/2+2πn) فـ f(yₙ)=−1.','xₙ,yₙ→0 مع نهايتين مختلفتين فلا نهاية، إذن f غير مستمرة عند 0. ∎']],\n['f(x)=(x tan x+2|x|sin x)/x عند 0 و g(x)=(x²+2|x|cos x)/x عند ±∞',['f=tan x+2|x|·(sin x/x)→0+0=0.','g(x)=x+2(|x|/x)cos x.','−2≤2(|x|/x)cos x≤2 فـ x−2≤g≤x+2: نهايتها −∞ عند −∞ و+∞ عند +∞. ∎']],\n['f(x)=e^(−1/x²) على ℝ*: هل تقبل تمديداً بالاستمرار عند 0؟ وf(x)=sin x/x؟',['x→0: −1/x²→−∞ فـ f→0، إذن f̃(0)=0.','sin x/x→1 عند 0.','التمديد: f̃(0)=1. ∎']],\n['f(x)=x²−2 على [1,4] ليبشيتزية. وبيّن أن x³−x=1 تقبل حلاً في [0,2]',['|x²−y²|=|x−y||x+y|≤8|x−y| على [1,4] (يكفي k=8).','g(x)=x³−x مستمرة وg(0)=0 وg(2)=6.','1 بين 0 و6 فحسب مبرهنة القيم المتوسطة ∃c∈[0,2]: g(c)=1. ∎']],\n['f(x)=x−1 إذا x>1 وx+1 إذا x≤1: النهايتان الجانبيتان عند 1 والمقاربات لـ 1/(x−1)',['f(1⁺)=0 وf(1⁻)=2 فلا نهاية عند 1.','انقطاع من النوع الأول (قفزة 2).','1/(x−1): النهاية اليمنى +∞ واليسرى −∞ فـ x=1 مقارب عمودي. ∎']]],\nh:['كيف أتعامل مع 0/0؟','جرّب التحليل والاختزال، ثم الضرب في المرافق للجذور، ثم توحيد المقامات أو النهايات المرجعية. لا تختزل حدوداً ليست عوامل مشتركة.']}\n];\nlet S={m:0,d:{},x:0},p=0;\ntry{Object.assign(S,JSON.parse(localStorage.getItem('an1')||'{}'))}catch(e){}\nif(!(S.m>=0&&S.m\u003cM.length))S.m=0;\nconst save=()=>{try{localStorage.setItem('an1',JSON.stringify({m:S.m,d:S.d,x:S.x}))}catch(e){}};\nfunction go(i){S.m=i;p=0;pwr=0;qtry=0;save();draw()}\nfunction nxt(d){p+=d;qtry=0;draw()}\nlet pwr=0,qtry=0;\nfunction pick(b,i){let q=M[S.m].q[p-M[S.m].s.length],bx=b.parentNode,old=bx.parentNode.querySelector('[data-h]');if(bx.dataset.l)return;if(old)old.remove();\nif(i==q[2]){bx.dataset.l=1;[...bx.children].forEach(e=>e.disabled=1);b.classList.add('ok');S.x+=qtry?5:10;\nbx.insertAdjacentHTML('afterend',`\u003cdiv class=ex>✅ صحيح! ${q[3]}\u003c/div>`);$('#go').hidden=0;save();top_();return}\npwr++;qtry++;b.disabled=1;b.classList.add('no');\nif(qtry>=2){bx.dataset.l=1;[...bx.children].forEach((e,j)=>{e.disabled=1;if(j==q[2])e.classList.add('ok')});bx.insertAdjacentHTML('afterend',`\u003cdiv class=ex>❌ الجواب الصحيح مظلَّل. ${q[3]}\u003c/div>`);$('#go').hidden=0}\nelse bx.insertAdjacentHTML('afterend',`\u003cdiv class=ex data-h=1>❌ ليست الصحيحة. لديك محاولة أخيرة: أعد قراءة درس «${M[S.m].s[Math.min(p-M[S.m].s.length,M[S.m].s.length-2)][0]}».\u003c/div>`);save();top_()}\nfunction top_(){let k=Object.keys(S.d).length;$('#xp').textContent=`⭐ ${S.x} نقطة · أنجزت ${k}/${M.length} فصول`;$('#bar i').style.width=k/M.length*100+'%'}\nfunction draw(){nv();if(mode!='learn'){mx();return}let m=M[S.m],n=m.s.length,L=n-2,h='';\nif(p\u003cn){let s=m.s[p];h=`\u003cdiv class=card>\u003cdiv class=tag>${m.t} — الدرس ${p+1} من ${n}\u003c/div>\u003ch2>${s[0]}\u003c/h2>${s[1]}${ezb()}${p==L&&m.w?W[m.w]:''}${p==L?`\u003cdetails>\u003csummary>${m.h[0]}\u003c/summary>${m.h[1]}\u003c/details>`:''}${p==L&&(m.e||m.x)?EX([m.e,...(m.x||[])].filter(Boolean)):''}\u003cdiv class=btns>\u003cbutton class=s onclick=nxt(-1) ${p?'':'hidden'}>السابق\u003c/button>\u003cbutton class=p onclick=nxt(1)>${p==n-1?'ابدأ الاختبار':'التالي'}\u003c/button>\u003c/div>\u003c/div>`}\nelse if(p-n\u003cm.q.length){let i=p-n,q=m.q[i];h=`\u003cdiv class=card>\u003cdiv class=tag>اختبار ${m.t} — سؤال ${i+1} من ${m.q.length}\u003c/div>\u003ch2>${q[0]}\u003c/h2>\u003cdiv>${q[1].map((o,j)=>`\u003cbutton class=o onclick=pick(thi
